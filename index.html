<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#09090b"/>
<title>Chouhdary Mobiles</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-title" content="CM Shop"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #09090b;
  --s1: #111114;
  --s2: #18181c;
  --s3: #202026;
  --s4: #28282f;
  --b: rgba(255,255,255,0.07);
  --b2: rgba(255,255,255,0.13);
  --t: #f1f1f5;
  --t2: #888899;
  --mu: #55555f;
  --ac: #aaff44;
  --ac2: rgba(170,255,68,0.15);
  --ac3: rgba(170,255,68,0.3);
  --rd: #ff4d6d;
  --rd2: rgba(255,77,109,0.14);
  --or: #ff9f43;
  --or2: rgba(255,159,67,0.14);
  --gr: #2ed573;
  --gr2: rgba(46,213,115,0.14);
  --bl: #5c95ff;
  --bl2: rgba(92,149,255,0.14);
  --pu: #9775fa;
  --pu2: rgba(151,117,250,0.14);
  --go: #ffd43b;
  --fn: 'Inter', -apple-system, sans-serif;
  --mo: 'SF Mono', 'Fira Code', monospace;
  --rad: 16px;
  --rads: 12px;
  --radx: 9px;
}
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; background: var(--bg); color: var(--t); font-family: var(--fn); overscroll-behavior: none; }

/* ── PIN SCREEN ── */
#pin-overlay { position: fixed; inset: 0; z-index: 999; display: none; }
#pin-overlay.active { display: block; }
.pin-wrap {
  height: 100%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 32px 24px;
  background: var(--bg);
}
.pin-top { text-align: center; margin-bottom: 48px; }
.pin-logo { font-size: 54px; line-height: 1; margin-bottom: 14px; }
.pin-name { font-size: 22px; font-weight: 800; letter-spacing: -.5px; }
.pin-hint { font-size: 13px; color: var(--mu); margin-top: 5px; }
.pin-label { font-size: 13px; color: var(--t2); font-weight: 500; margin-bottom: 20px; }
.pin-dots { display: flex; gap: 14px; margin-bottom: 36px; }
.pdot {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--s3); border: 2px solid var(--b2);
  transition: all .2s cubic-bezier(.34,1.56,.64,1);
}
.pdot.on { background: var(--ac); border-color: var(--ac); transform: scale(1.25); }
.pdot.err { background: var(--rd); border-color: var(--rd); }
.pin-pad {
  display: grid; grid-template-columns: repeat(3, 80px);
  grid-template-rows: repeat(4, 72px); gap: 10px;
}
.pk {
  border-radius: var(--rads); background: var(--s2); border: 1px solid var(--b);
  font-size: 22px; font-weight: 600; color: var(--t); cursor: pointer; font-family: var(--fn);
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  transition: background .12s, transform .12s; user-select: none;
}
.pk sub { font-size: 8px; color: var(--mu); letter-spacing: .12em; font-weight: 500; margin-top: 1px; }
.pk:active { background: var(--s4); transform: scale(.93); }
.pk.del { font-size: 18px; color: var(--t2); }
.pk.ghost { background: transparent; border-color: transparent; pointer-events: none; }
.pin-err { font-size: 12px; color: var(--rd); min-height: 16px; text-align: center; margin-top: 12px; font-weight: 500; }
.pin-forgot { background: none; border: none; color: var(--mu); font-size: 12px; margin-top: 16px; cursor: pointer; font-family: var(--fn); text-decoration: underline; }

/* ── APP SHELL ── */
.app { display: flex; flex-direction: column; height: 100dvh; max-width: 430px; margin: 0 auto; }

/* ── TOP BAR ── */
.topbar {
  flex-shrink: 0;
  padding: 52px 20px 0;
  background: var(--bg);
}
.topbar-row { display: flex; flex-direction: column; align-items: center; margin-bottom: 14px; gap: 6px; }
.shop-brand { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.shop-icon { display: none; }
.shop-name { font-size: 26px; font-weight: 900; letter-spacing: -1px; text-align: center; }
.shop-sub { font-size: 11px; color: var(--mu); margin-top: 1px; text-align: center; }
.topbar-actions { display: flex; align-items: center; gap: 8px; }
.tb-btn {
  display: flex; align-items: center; gap: 6px;
  background: var(--s2); border: 1px solid var(--b); border-radius: 20px;
  padding: 7px 13px; font-size: 11px; font-weight: 600; color: var(--t2);
  cursor: pointer; font-family: var(--fn); transition: all .15s;
}
.tb-btn.synced { color: var(--ac); border-color: var(--ac3); background: var(--ac2); }
.tb-btn.warn { color: var(--or); border-color: var(--or2); }
.tb-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.cart-btn {
  position: relative; background: var(--s2); border: 1px solid var(--b);
  border-radius: 12px; padding: 8px 11px; font-size: 18px; cursor: pointer; transition: all .15s;
}
.cart-btn:active { background: var(--s3); transform: scale(.93); }
.cart-n {
  position: absolute; top: -5px; right: -5px; background: var(--ac); color: var(--bg);
  font-size: 9px; font-weight: 900; border-radius: 10px; min-width: 17px; height: 17px;
  padding: 0 4px; display: flex; align-items: center; justify-content: center;
}

/* ── STATS STRIP ── */
.stats-strip { display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 16px; margin: 0 -20px; }
.stats-strip::-webkit-scrollbar { display: none; }
.stat {
  flex-shrink: 0; background: var(--s1); border: 1px solid var(--b);
  border-radius: var(--rads); padding: 10px 14px; min-width: 90px;
}
.stat-lbl { font-size: 9px; color: var(--mu); text-transform: uppercase; letter-spacing: .07em; font-weight: 600; margin-bottom: 4px; white-space: nowrap; }
.stat-val { font-size: 15px; font-weight: 700; font-family: var(--mo); }
.stat-val.g { color: var(--ac); }
.stat-val.o { color: var(--or); }
.stat-val.b { color: var(--bl); }
.stat-val.p { color: var(--pu); }
.stat-val.r { color: var(--rd); }

/* ── CONTENT ── */
.content { flex: 1; overflow-y: auto; padding: 16px 20px 100px; -webkit-overflow-scrolling: touch; }
.content > * { animation: fadeIn .2s ease both; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ── BOTTOM NAV ── */
.bnav {
  flex-shrink: 0;
  display: flex; align-items: stretch;
  background: var(--s1); border-top: 1px solid var(--b);
  padding-bottom: env(safe-area-inset-bottom, 0);
  overflow-x: auto; overflow-y: hidden;
}
.bnav::-webkit-scrollbar { display: none; }
.ni {
  flex-shrink: 0; min-width: 64px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 9px 8px 10px; gap: 4px; border: none; background: none; cursor: pointer;
  font-family: var(--fn); font-size: 10px; font-weight: 500; color: var(--mu);
  border-top: 2px solid transparent; margin-top: -1px; transition: color .15s; white-space: nowrap;
}
.ni .ic { font-size: 22px; transition: transform .2s cubic-bezier(.34,1.56,.64,1); }
.ni.on { color: var(--ac); border-top-color: var(--ac); }
.ni.on .ic { transform: scale(1.15); }
.ni.more-btn .ic { font-size: 20px; }

/* ── MORE DRAWER ── */
.more-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 200;
  display: none; align-items: flex-end; justify-content: center;
}
.more-overlay.open { display: flex; }
.more-sheet {
  background: var(--s1); border: 1px solid var(--b2); border-bottom: none;
  border-radius: 24px 24px 0 0; width: 100%; max-width: 430px;
  padding: 0 20px 40px;
}
.more-handle { width: 36px; height: 4px; background: var(--b2); border-radius: 2px; margin: 12px auto 22px; }
.more-title { font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .1em; font-weight: 700; margin-bottom: 14px; }
.more-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.mg-item {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: var(--s2); border: 1px solid var(--b); border-radius: 14px;
  padding: 14px 8px; cursor: pointer; transition: all .15s;
}
.mg-item:active { background: var(--s3); transform: scale(.94); }
.mg-item.on { background: var(--ac2); border-color: var(--ac3); }
.mg-item .mgi { font-size: 22px; }
.mg-item .mgn { font-size: 10px; font-weight: 600; color: var(--t2); white-space: nowrap; }
.mg-item.on .mgn { color: var(--ac); }

/* ── CARDS ── */
.card {
  background: var(--s1); border: 1px solid var(--b);
  border-radius: var(--rad); padding: 16px; margin-bottom: 10px;
}
.card + .card { margin-top: 0; }

/* Dashboard banners */
.banner {
  border-radius: var(--rad); padding: 18px; margin-bottom: 10px;
  border: 1px solid var(--b);
}
.banner.day { background: linear-gradient(160deg, #0e1a08 0%, #090e17 100%); border-color: rgba(170,255,68,.14); }
.banner.mon { background: linear-gradient(160deg, #0a1020 0%, #130a20 100%); border-color: rgba(92,149,255,.12); }
.bnr-hd { font-size: 10px; color: var(--mu); text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; }
.bnr-hd em { color: var(--ac); font-style: normal; }
.bnr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
.bnr-cell-lbl { font-size: 9px; color: var(--mu); text-transform: uppercase; font-weight: 600; letter-spacing: .05em; }
.bnr-cell-val { font-size: 16px; font-weight: 700; font-family: var(--mo); margin-top: 3px; }
.bnr-cell-val.g { color: var(--ac); }
.bnr-cell-val.b { color: var(--bl); }
.bnr-cell-val.w { color: var(--t); }
.bnr-div { height: 1px; background: var(--b); margin: 14px 0; }
.bnr-net { display: flex; justify-content: space-between; align-items: center; }
.bnr-net-lbl { font-size: 11px; color: var(--t2); font-weight: 500; }
.bnr-net-val { font-size: 24px; font-weight: 900; font-family: var(--mo); color: var(--ac); letter-spacing: -1px; }

/* Inventory items */
.inv {
  background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad);
  padding: 15px; margin-bottom: 9px;
}
.inv-top { display: flex; align-items: flex-start; gap: 13px; }
.inv-icon {
  width: 46px; height: 46px; border-radius: 13px; background: var(--s2);
  display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
}
.inv-info { flex: 1; min-width: 0; }
.inv-name { font-size: 15px; font-weight: 600; letter-spacing: -.2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.inv-meta { font-size: 11px; color: var(--t2); margin-top: 4px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.inv-qty-box { text-align: right; flex-shrink: 0; }
.inv-qty { font-size: 22px; font-weight: 800; font-family: var(--mo); line-height: 1; }
.inv-qty.ok { color: var(--ac); }
.inv-qty.low { color: var(--or); }
.inv-qty.out { color: var(--rd); }
.inv-qty-lbl { font-size: 9px; color: var(--mu); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; margin-top: 1px; }
.inv-bot { display: flex; align-items: center; justify-content: space-between; margin-top: 13px; padding-top: 12px; border-top: 1px solid var(--b); }
.price-row { display: flex; gap: 16px; }
.price-col { display: flex; flex-direction: column; }
.price-lbl { font-size: 9px; color: var(--mu); text-transform: uppercase; font-weight: 600; letter-spacing: .05em; }
.price-val { font-size: 13px; font-weight: 700; font-family: var(--mo); margin-top: 2px; }
.price-val.hi { color: var(--ac); }
.inv-acts { display: flex; gap: 6px; }
.act {
  background: var(--s2); border: 1px solid var(--b); border-radius: 9px;
  padding: 7px 11px; font-size: 12px; font-weight: 600; color: var(--t);
  cursor: pointer; font-family: var(--fn); transition: all .12s;
}
.act:active { transform: scale(.93); }
.act.sell { background: var(--ac); color: var(--bg); border-color: var(--ac); }
.act.cart { background: var(--ac2); color: var(--ac); border-color: var(--ac3); }
.act.del { color: var(--rd); border-color: var(--rd2); }
.act.edit { color: var(--bl); border-color: var(--bl2); }
.badge { font-size: 9px; padding: 2px 7px; border-radius: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
.badge.low { background: var(--or2); color: var(--or); }
.badge.out { background: var(--rd2); color: var(--rd); }
.eye-btn { background: none; border: none; color: var(--mu); cursor: pointer; padding: 3px 6px; font-size: 14px; }
.pr-reveal { font-size: 12px; font-family: var(--mo); color: var(--or); background: var(--or2); border-radius: 6px; padding: 2px 8px; display: none; }
.pr-reveal.show { display: inline-block; }

/* Cart */
.cart-item {
  background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad);
  padding: 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
}
.ci-icon { font-size: 20px; width: 42px; height: 42px; border-radius: 11px; background: var(--s2); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ci-info { flex: 1; min-width: 0; }
.ci-name { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ci-price { font-size: 11px; color: var(--t2); margin-top: 3px; }
.ci-right { display: flex; flex-direction: column; align-items: flex-end; gap: 7px; flex-shrink: 0; }
.ci-total { font-size: 14px; font-weight: 700; font-family: var(--mo); color: var(--ac); }
.qty-ctrl { display: flex; align-items: center; gap: 8px; }
.qc { width: 28px; height: 28px; border-radius: 8px; background: var(--s2); border: 1px solid var(--b); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .12s; }
.qc:active { background: var(--s3); transform: scale(.9); }
.qc.rm { color: var(--rd); }
.qc-n { font-size: 14px; font-weight: 700; font-family: var(--mo); min-width: 20px; text-align: center; }
.ci-price-in { background: var(--s2); border: 1px solid var(--b); border-radius: 8px; padding: 5px 8px; font-size: 13px; font-family: var(--mo); color: var(--t); width: 88px; text-align: right; outline: none; }
.ci-price-in:focus { border-color: var(--ac); }
.cart-sum { background: var(--s1); border: 1px solid var(--ac3); border-radius: var(--rad); padding: 16px; margin-bottom: 12px; }
.cs-row { display: flex; justify-content: space-between; font-size: 13px; margin-bottom: 7px; color: var(--t2); }
.cs-total { font-size: 22px; font-weight: 800; font-family: var(--mo); color: var(--ac); }

/* Purchase history */
.pur { background: var(--s1); border: 1px solid var(--b); border-left: 3px solid var(--bl); border-radius: var(--rad); padding: 13px; margin-bottom: 8px; }
.pur-name { font-size: 14px; font-weight: 600; }
.pur-meta { font-size: 11px; color: var(--t2); margin-top: 3px; }
.pur-cost { font-size: 16px; font-weight: 700; font-family: var(--mo); color: var(--bl); }

/* Forms */
.fcard { background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad); padding: 18px; margin-bottom: 10px; }
.ftitle { font-size: 10px; font-weight: 700; color: var(--mu); text-transform: uppercase; letter-spacing: .1em; margin-bottom: 16px; }
.fgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.ff { display: flex; flex-direction: column; gap: 6px; }
.ff.full { grid-column: 1 / -1; }
.ff label { font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .06em; font-weight: 600; }
.ff input, .ff select, .ff textarea {
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 12px 13px; font-size: 14px; color: var(--t); font-family: var(--fn);
  outline: none; width: 100%; -webkit-appearance: none; transition: border-color .15s;
}
.ff input:focus, .ff select:focus, .ff textarea:focus { border-color: var(--ac); }
.ff input::placeholder, .ff textarea::placeholder { color: var(--mu); }

/* Buttons */
.btn {
  width: 100%; padding: 15px; border: none; border-radius: var(--rads);
  font-size: 15px; font-weight: 700; font-family: var(--fn); cursor: pointer;
  transition: all .12s; letter-spacing: -.1px;
}
.btn:active { transform: scale(.98); opacity: .88; }
.btn.pri { background: var(--ac); color: var(--bg); }
.btn.sec { background: var(--s2); color: var(--t); border: 1px solid var(--b); }
.btn.blue { background: var(--bl); color: var(--bg); }
.btn.purple { background: var(--pu); color: #fff; }
.btn.danger { background: var(--rd); color: #fff; }
.btn.warn { background: var(--or); color: var(--bg); }
.btn-gap { height: 8px; }

/* Sale items list */
.si {
  background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad);
  padding: 12px 14px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px;
}
.si-icon { width: 40px; height: 40px; border-radius: 10px; background: var(--ac2); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; }
.si-info { flex: 1; min-width: 0; }
.si-name { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.si-meta { font-size: 11px; color: var(--t2); margin-top: 2px; }
.si-right { text-align: right; flex-shrink: 0; }
.si-amt { font-size: 14px; font-weight: 700; font-family: var(--mo); color: var(--ac); }
.si-profit { font-size: 11px; color: var(--gr); }
.del-btn { background: none; border: none; color: var(--rd); font-size: 13px; cursor: pointer; padding: 3px; opacity: .6; display: block; margin-left: auto; margin-top: 2px; }

/* Udhaar */
.ud {
  background: var(--s1); border: 1px solid var(--b); border-left: 3px solid var(--or);
  border-radius: var(--rad); padding: 14px; margin-bottom: 8px;
}
.ud.paid { border-left-color: var(--gr); opacity: .5; }
.ud-name { font-size: 15px; font-weight: 600; }
.ud-meta { font-size: 11px; color: var(--t2); margin-top: 4px; }
.ud-amt { font-size: 20px; font-weight: 800; font-family: var(--mo); color: var(--or); }
.ud-amt.p { color: var(--gr); }
.ud-badge { font-size: 10px; font-weight: 700; text-transform: uppercase; padding: 3px 10px; border-radius: 20px; display: inline-block; letter-spacing: .04em; margin-top: 6px; }
.ud-badge.pen { background: var(--or2); color: var(--or); }
.ud-badge.paid { background: var(--gr2); color: var(--gr); }

/* USB */
.usb {
  background: var(--s1); border: 1px solid var(--b); border-left: 3px solid var(--bl);
  border-radius: var(--rad); padding: 14px; margin-bottom: 8px;
}
.usb-desc { font-size: 14px; font-weight: 500; }
.usb-meta { font-size: 11px; color: var(--t2); margin-top: 3px; }
.usb-charge { font-size: 18px; font-weight: 700; font-family: var(--mo); color: var(--bl); }
.usb-profit { font-size: 11px; color: var(--gr); margin-top: 2px; }

/* Wallets */
.wallet-card { background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad); padding: 18px; margin-bottom: 10px; }
.wc-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
.wc-title { font-size: 14px; font-weight: 600; display: flex; align-items: center; gap: 8px; }
.wc-bal { font-size: 24px; font-weight: 800; font-family: var(--mo); }
.wc-bal.jazz { color: var(--pu); }
.wc-bal.easy { color: var(--bl); }
.tx { display: flex; justify-content: space-between; align-items: center; padding: 11px 0; border-bottom: 1px solid var(--b); }
.tx:last-child { border-bottom: none; }
.tx-desc { font-size: 13px; font-weight: 500; }
.tx-meta { font-size: 11px; color: var(--mu); margin-top: 2px; }
.tx-amt { font-size: 13px; font-weight: 700; font-family: var(--mo); }
.tx-amt.in { color: var(--ac); }
.tx-amt.out { color: var(--rd); }

/* Expenses */
.exp {
  background: var(--s1); border: 1px solid var(--b); border-left: 3px solid var(--rd);
  border-radius: var(--rad); padding: 14px; margin-bottom: 8px;
  display: flex; justify-content: space-between; align-items: center;
}
.exp-left { flex: 1; min-width: 0; }
.exp-desc { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.exp-meta { font-size: 11px; color: var(--t2); margin-top: 3px; }
.exp-cat { display: inline-block; font-size: 10px; padding: 2px 8px; border-radius: 8px; background: var(--rd2); color: var(--rd); font-weight: 600; text-transform: uppercase; margin-top: 4px; }
.exp-right { text-align: right; flex-shrink: 0; margin-left: 12px; }
.exp-amt { font-size: 16px; font-weight: 700; font-family: var(--mo); color: var(--rd); }

/* Balance */
.bal-hero {
  background: linear-gradient(150deg, #0d1a07 0%, #08101a 100%);
  border: 1px solid rgba(170,255,68,.14); border-radius: var(--rad);
  padding: 20px; margin-bottom: 12px;
}
.bal-hero-lbl { font-size: 10px; color: var(--mu); text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin-bottom: 14px; display: flex; justify-content: space-between; }
.bal-hero-lbl em { color: var(--ac); font-style: normal; }
.bal-wallets { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.bwallet {
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 14px; cursor: pointer; transition: border-color .15s, transform .12s;
}
.bwallet:active { border-color: var(--ac); transform: scale(.96); }
.bw-icon { font-size: 22px; margin-bottom: 6px; }
.bw-lbl { font-size: 9px; color: var(--mu); text-transform: uppercase; letter-spacing: .07em; font-weight: 700; }
.bw-val { font-size: 17px; font-weight: 700; font-family: var(--mo); margin-top: 3px; }
.bw-val.cash { color: var(--ac); }
.bw-val.jazz { color: var(--pu); }
.bw-val.easy { color: var(--bl); }
.bw-val.bank { color: var(--go); }
.bal-total { display: flex; justify-content: space-between; align-items: center; padding-top: 14px; border-top: 1px solid var(--b); }
.bal-total-lbl { font-size: 12px; color: var(--t2); font-weight: 500; }
.bal-total-val { font-size: 26px; font-weight: 900; font-family: var(--mo); color: var(--ac); letter-spacing: -1px; }

/* Reports */
.rep-sect { margin-bottom: 22px; }
.rep-sect-title { font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .09em; font-weight: 700; margin-bottom: 12px; }
.rep-cards { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.rep-card { background: var(--s1); border: 1px solid var(--b); border-radius: var(--rads); padding: 14px; }
.rep-card-lbl { font-size: 11px; color: var(--t2); margin-bottom: 5px; }
.rep-card-val { font-size: 22px; font-weight: 700; font-family: var(--mo); }
.rep-card-val.g { color: var(--ac); }
.rep-card-val.b { color: var(--bl); }
.rep-card-val.p { color: var(--pu); }
.rep-card-val.r { color: var(--rd); }
.bar-item { display: flex; align-items: center; gap: 8px; margin-bottom: 10px; }
.bar-name { font-size: 12px; width: 90px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar-wrap { flex: 1; height: 5px; background: var(--s2); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 5px; border-radius: 3px; background: var(--ac); }
.bar-val { font-size: 11px; font-family: var(--mo); color: var(--ac); width: 68px; text-align: right; flex-shrink: 0; }
.month-row { background: var(--s1); border: 1px solid var(--b); border-radius: var(--rad); padding: 14px; margin-bottom: 8px; }

/* Search */
.search-bar { display: flex; gap: 8px; margin-bottom: 12px; }
.search-in {
  flex: 1; background: var(--s1); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 11px 14px; font-size: 14px; color: var(--t); font-family: var(--fn); outline: none;
  transition: border-color .15s;
}
.search-in:focus { border-color: var(--ac); }
.search-in::placeholder { color: var(--mu); }
.filter-sel {
  background: var(--s1); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 11px 11px; font-size: 12px; color: var(--t); font-family: var(--fn);
  outline: none; -webkit-appearance: none; cursor: pointer;
}

/* Section tabs */
.stabs { display: flex; gap: 6px; margin-bottom: 12px; }
.stab {
  flex: 1; padding: 9px; text-align: center; font-size: 12px; font-weight: 600;
  background: var(--s1); border: 1px solid var(--b); border-radius: var(--radx);
  color: var(--mu); cursor: pointer; transition: all .15s;
}
.stab.on { background: var(--ac2); color: var(--ac); border-color: var(--ac3); }

/* ── NEW FEATURE STYLES ── */
/* Skeleton shimmer */
.skel { background: linear-gradient(90deg,var(--s2) 25%,var(--s3) 50%,var(--s2) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; border-radius: var(--rad); margin-bottom: 10px; }
@keyframes shimmer { 0%{background-position:200% 0} 100%{background-position:-200% 0} }

/* Hero card */
.hero { background: linear-gradient(145deg,#0c1a06 0%,#080f1a 100%); border: 1px solid rgba(170,255,68,.22); border-radius: var(--rad); padding: 20px; margin-bottom: 14px; position: relative; overflow: hidden; }
.hero::before { content:''; position:absolute; top:-40px; right:-30px; width:130px; height:130px; background:radial-gradient(circle,rgba(170,255,68,.09),transparent 70%); pointer-events:none; }
.hero-lbl { font-size:10px; color:var(--mu); text-transform:uppercase; letter-spacing:.1em; font-weight:700; margin-bottom:6px; }
.hero-profit { font-size:40px; font-weight:900; font-family:var(--mo); color:var(--ac); letter-spacing:-2px; line-height:1.1; }
.hero-stats { display:flex; gap:22px; margin-top:16px; }
.hs { display:flex; flex-direction:column; }
.hs-n { font-size:15px; font-weight:700; font-family:var(--mo); }
.hs-l { font-size:10px; color:var(--mu); text-transform:uppercase; letter-spacing:.06em; font-weight:600; margin-top:1px; }
.goal-wrap { margin-top:14px; padding-top:14px; border-top:1px solid rgba(170,255,68,.12); }
.goal-track { height:5px; background:rgba(255,255,255,.07); border-radius:3px; overflow:hidden; margin-bottom:5px; }
.goal-fill { height:5px; background:var(--ac); border-radius:3px; transition:width .5s ease; }
.goal-meta { display:flex; justify-content:space-between; font-size:11px; color:var(--t2); }
.goal-pct { font-weight:700; color:var(--ac); }

/* Quick sell */
.qs { margin-bottom:14px; }
.qs-hd { font-size:10px; color:var(--mu); text-transform:uppercase; letter-spacing:.08em; font-weight:700; margin-bottom:8px; }
.qs-row { display:flex; gap:8px; overflow-x:auto; padding-bottom:2px; }
.qs-row::-webkit-scrollbar { display:none; }
.qs-chip { flex-shrink:0; background:var(--s2); border:1px solid var(--b); border-radius:24px; padding:8px 14px; display:flex; align-items:center; gap:7px; cursor:pointer; transition:all .12s; }
.qs-chip:active { background:var(--s3); transform:scale(.93); }
.qs-em { font-size:15px; }
.qs-name { font-size:12px; font-weight:600; max-width:90px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.qs-pr { font-size:11px; color:var(--ac); font-family:var(--mo); font-weight:700; }

/* Pull to refresh */
.ptr { text-align:center; font-size:12px; color:var(--mu); max-height:0; overflow:hidden; transition:max-height .25s,padding .25s; }
.ptr.show { max-height:48px; padding:12px 0; }
.ptr-spin { display:inline-block; font-size:18px; animation:spin .8s linear infinite; }
@keyframes spin { to { transform:rotate(360deg); } }

/* Low stock dot on More nav */
.nav-dot { position:absolute; top:8px; right:calc(50% - 18px); width:7px; height:7px; background:var(--rd); border-radius:50%; border:2px solid var(--s1); }

/* 6-month chart */
.chart6-bars { display:flex; align-items:flex-end; gap:6px; height:72px; margin-bottom:6px; }
.c6col { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end; }
.c6bar { width:100%; border-radius:4px 4px 0 0; min-height:3px; }
.c6bar.cur { background:var(--ac); }
.c6bar.old { background:var(--s3); }
.c6lbl { font-size:9px; color:var(--mu); font-weight:600; }
.c6val { font-size:9px; color:var(--t2); font-family:var(--mo); white-space:nowrap; }

/* Swipe-to-delete */
.sw-wrap { position:relative; overflow:hidden; border-radius:var(--rad); margin-bottom:9px; }
.sw-del-bg { position:absolute; right:0; top:0; bottom:0; background:var(--rd2); display:flex; align-items:center; justify-content:center; width:72px; color:var(--rd); font-size:22px; cursor:pointer; }
.sw-inner { position:relative; z-index:1; border-radius:var(--rad); }
.sw-inner.snap { transition:transform .2s ease; }

/* Modal */
.modal-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7);
  z-index: 100; display: flex; align-items: flex-end; justify-content: center;
  backdrop-filter: blur(6px);
}
.modal {
  background: var(--s1); border: 1px solid var(--b2); border-bottom: none;
  border-radius: 24px 24px 0 0; padding: 0 20px 52px;
  width: 100%; max-width: 430px; max-height: 92vh; overflow-y: auto;
}
.modal-handle { width: 36px; height: 4px; background: var(--b2); border-radius: 2px; margin: 12px auto 20px; }
.modal-title { font-size: 18px; font-weight: 700; letter-spacing: -.3px; margin-bottom: 4px; }
.modal-sub { font-size: 12px; color: var(--t2); margin-bottom: 18px; }
.modal-info { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 18px; }
.mii { background: var(--s2); border: 1px solid var(--b); border-radius: var(--rads); padding: 11px; }
.mii-lbl { font-size: 10px; color: var(--mu); text-transform: uppercase; letter-spacing: .05em; font-weight: 600; }
.mii-val { font-size: 15px; font-weight: 700; font-family: var(--mo); margin-top: 3px; }
.qty-in {
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 13px 14px; font-size: 16px; color: var(--t); font-family: var(--fn);
  outline: none; width: 100%; transition: border-color .15s;
}
.qty-in:focus { border-color: var(--ac); }

/* Wallet selector */
.wsel { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
.wsel-btn {
  background: var(--s2); border: 1px solid var(--b); border-radius: var(--rads);
  padding: 10px 6px; text-align: center; cursor: pointer; transition: all .15s;
}
.wsel-btn .wi { font-size: 18px; display: block; margin-bottom: 3px; }
.wsel-btn .wn { font-size: 9px; color: var(--mu); text-transform: uppercase; font-weight: 600; }
.wsel-btn.active { border-color: var(--ac); background: var(--ac2); }
.wsel-btn.active .wn { color: var(--ac); }

/* Misc */
.customer-chip { display: inline-flex; align-items: center; gap: 4px; background: var(--bl2); border-radius: 8px; padding: 2px 8px; font-size: 10px; color: var(--bl); font-weight: 600; margin-top: 3px; }
.fin-tag { display: inline-block; font-size: 9px; padding: 1px 6px; border-radius: 8px; background: var(--rd2); color: var(--rd); font-weight: 700; text-transform: uppercase; margin-left: 5px; }
.bargain-hint { font-size: 11px; color: var(--t2); margin-top: 5px; padding: 9px 12px; background: var(--or2); border-radius: var(--radx); border-left: 3px solid var(--or); }
.empty { text-align: center; padding: 60px 20px; color: var(--mu); }
.empty-icon { font-size: 44px; margin-bottom: 12px; opacity: .5; }
.empty-text { font-size: 14px; line-height: 1.6; }
.divider { height: 1px; background: var(--b); margin: 14px 0; }
.sec-lbl { font-size: 11px; color: var(--mu); text-transform: uppercase; letter-spacing: .08em; font-weight: 700; margin-bottom: 10px; }
.toast {
  position: fixed; bottom: 90px; left: 50%;
  transform: translateX(-50%) translateY(8px);
  background: var(--s3); border: 1px solid var(--b2); border-radius: 28px;
  padding: 11px 22px; font-size: 13px; color: var(--t); font-weight: 500;
  opacity: 0; transition: opacity .2s, transform .2s;
  pointer-events: none; white-space: nowrap; z-index: 500;
  box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.settings-row { display: flex; align-items: center; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid var(--b); }
.settings-row:last-child { border-bottom: none; }
.sr-icon { width: 38px; height: 38px; border-radius: 11px; background: var(--s2); border: 1px solid var(--b); display: flex; align-items: center; justify-content: center; font-size: 18px; flex-shrink: 0; margin-right: 12px; }
.sr-title { font-size: 14px; font-weight: 500; }
.sr-sub { font-size: 11px; color: var(--mu); margin-top: 2px; }
.sr-action { font-size: 12px; color: var(--ac); font-weight: 700; cursor: pointer; background: none; border: none; font-family: var(--fn); }

@keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="modal"></div>
<div id="pin-overlay"></div>

<!-- More drawer -->
<div class="more-overlay" id="more-overlay" onclick="if(event.target===this)closeMore()">
  <div class="more-sheet">
    <div class="more-handle"></div>
    <div class="more-title">More</div>
    <div class="more-grid">
      <div class="mg-item" id="mg-cart" onclick="openFromMore('cart')"><span class="mgi">🛒</span><span class="mgn">Cart</span></div>
      <div class="mg-item" id="mg-udhaar" onclick="openFromMore('udhaar')"><span class="mgi">📒</span><span class="mgn">Udhaar</span></div>
      <div class="mg-item" id="mg-addItem" onclick="openFromMore('addItem')"><span class="mgi">➕</span><span class="mgn">Add Item</span></div>
    </div>
  </div>
</div>

<div class="app" id="app" style="display:none">
  <div class="topbar">
    <div class="topbar-row">
      <div style="display:flex;justify-content:flex-end;width:100%;gap:8px;margin-bottom:4px">
        <button class="cart-btn" id="cart-fab" onclick="setTab('cart')" style="display:none">🛒<span class="cart-n" id="cart-count">0</span></button>
        <button class="tb-btn synced" id="syncBtn" onclick="syncAll()"><span class="tb-dot"></span><span id="syncTxt">Synced</span></button>
      </div>
      <div class="shop-brand">
        <div class="shop-name">Chouhdary Mobiles</div>
        <div class="shop-sub">POS &amp; Inventory · <span style="color:var(--ac)">v4.0</span></div>
      </div>
    </div>
    <div class="stats-strip">
      <div class="stat"><div class="stat-lbl">Customers</div><div class="stat-val" id="s-customers">--</div></div>
      <div class="stat"><div class="stat-lbl">Today Profit</div><div class="stat-val g" id="s-today">--</div></div>
      <div class="stat"><div class="stat-lbl">Udhaar</div><div class="stat-val o" id="s-udhaar">--</div></div>
      <div class="stat"><div class="stat-lbl">USB</div><div class="stat-val b" id="s-usb">--</div></div>
      <div class="stat"><div class="stat-lbl">Repair</div><div class="stat-val p" id="s-repair">--</div></div>
      <div class="stat"><div class="stat-lbl">Wallets</div><div class="stat-val p" id="s-wallet">--</div></div>
      <div class="stat"><div class="stat-lbl">Expenses</div><div class="stat-val r" id="s-expense">--</div></div>
    </div>
  </div>

  <div class="content" id="content"></div>

  <nav class="bnav">
    <button class="ni on" onclick="setTab('sell',this)" data-tab="sell"><span class="ic">💰</span><span>Sell</span></button>
    <button class="ni" onclick="setTab('usb',this)" data-tab="usb"><span class="ic">🔧</span><span>USB</span></button>
    <button class="ni" onclick="setTab('wallets',this)" data-tab="wallets"><span class="ic">💳</span><span>Wallets</span></button>
    <button class="ni" onclick="setTab('kharcha',this)" data-tab="kharcha"><span class="ic">💸</span><span>Expenses</span></button>
    <button class="ni" onclick="setTab('balance',this)" data-tab="balance"><span class="ic">💼</span><span>Balance</span></button>
    <button class="ni" onclick="setTab('sales',this)" data-tab="sales"><span class="ic">📋</span><span>Sales</span></button>
    <button class="ni" onclick="setTab('reports',this)" data-tab="reports"><span class="ic">📊</span><span>Reports</span></button>
    <button class="ni" onclick="setTab('inventory',this)" data-tab="inventory"><span class="ic">📦</span><span>Stock</span></button>
    <button class="ni" onclick="setTab('settings',this)" data-tab="settings"><span class="ic">⚙️</span><span>Settings</span></button>
    <button class="ni more-btn" onclick="openMore()" id="more-nav-btn"><span class="ic">⋯</span><span>More</span></button>
  </nav>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxRjvW4HtnoZQtFsppL3uS0_WqZUjVp7ZEmbdFjrG5isbyjFrGoOlNcqIASqDO_ViNu/exec';
const FIN_API='https://script.google.com/macros/s/AKfycbz30Lg-ObvWIc2dt_dCOy0ibu9JwnCr74NxYddUx69pcvmCG8TbjQdeUHKwYVEhlS_SWA/exec';
const CAT_EMOJI={'Mobile Phones':'📱','Accessories':'🎧','Chargers':'🔌','Cables':'🔗','Cases':'🛡️','Earphones':'🎵','Batteries':'🔋','Screens':'📺','Memory':'💾','Electronics':'⚡','Other':'📦'};
const CATS=Object.keys(CAT_EMOJI);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const EXP_CATS=['Rent','Electricity','Staff Salary','Stock Purchase','Maintenance','Transport','Other'];

let inventory=[],sales=[],reports={},usbJobs=[],walletTx=[],udhaarList=[],expenses=[];
let balances={cash:0,jazz:0,easy:0,bank:0},balanceTx=[],finExpenses=[],purchases=[];
let cart=[];
let activeTab='sell',searchQ='',filterCat='',isSyncing=false,revealTimers={};

// ── PIN ──
let pinEntry='',pinMode='',pinSetTemp='';
function initApp(){
  const p=localStorage.getItem('cm_pin');
  if(p){showPinScreen('enter');}else{launchApp();}
}
function showPinScreen(mode){
  pinMode=mode;pinEntry='';
  const isEnter=mode==='enter',isConfirm=mode==='confirm';
  const ov=document.getElementById('pin-overlay');ov.classList.add('active');
  ov.innerHTML=`
    <div class="pin-screen">
      <div class="pin-logo">📱</div>
      <div class="pin-shopname">Chouhdary Mobiles</div>
      <div class="pin-sub">POS &amp; Inventory System</div>
      <div class="pin-title">${isEnter?'Enter PIN':mode==='set'?'Set New PIN':'Confirm PIN'}</div>
      <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
      <div class="pin-err" id="pin-err"></div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="pin-btn${k===''?' empty':k==='⌫'?' del':''}" onclick="pinPress('${k}')">${k}</button>`).join('')}
      </div>
      ${isEnter?`<button class="pin-forgot" onclick="forgotPin()">Forgot PIN?</button>`:''}
    </div>`;
}
function pinPress(k){
  if(k==='')return;
  if(k==='⌫'){pinEntry=pinEntry.slice(0,-1);updDots();return;}
  if(pinEntry.length>=4)return;
  pinEntry+=String(k);updDots();
  if(pinEntry.length===4)setTimeout(submitPin,150);
}
function updDots(){for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.className='pin-dot'+(i<pinEntry.length?' filled':'');}}
function submitPin(){
  const saved=localStorage.getItem('cm_pin');
  if(pinMode==='enter'){
    if(pinEntry===saved){const ov=document.getElementById('pin-overlay');ov.innerHTML='';ov.classList.remove('active');launchApp();}
    else{pinErr('Wrong PIN. Try again.');}
  }else if(pinMode==='set'){
    pinSetTemp=pinEntry;showPinScreen('confirm');
  }else{
    if(pinEntry===pinSetTemp){localStorage.setItem('cm_pin',pinEntry);const ov=document.getElementById('pin-overlay');ov.innerHTML='';ov.classList.remove('active');toast('PIN set ✅');if(activeTab==='settings')renderTab();}
    else{pinErr('PINs do not match.');setTimeout(()=>showPinScreen('set'),900);}
  }
}
function pinErr(msg){
  document.getElementById('pin-err').textContent=msg;
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.className='pin-dot error';d.style.animation='shake .3s';}}
  setTimeout(()=>{pinEntry='';updDots();const e=document.getElementById('pin-err');if(e)e.textContent='';},850);
}
function forgotPin(){if(confirm('Reset PIN? App will open without PIN.')){localStorage.removeItem('cm_pin');const ov=document.getElementById('pin-overlay');ov.innerHTML='';ov.classList.remove('active');launchApp();}}
function launchApp(){document.getElementById('app').style.display='flex';loadLocal();updateSummary();renderTab();syncAll();fetchFinExpenses();setTimeout(initPullToRefresh,600);}

// ── STORAGE ──
function saveLocal(){
  try{
    localStorage.setItem('cm_inv',JSON.stringify(inventory));
    localStorage.setItem('cm_sales',JSON.stringify(sales));
    localStorage.setItem('cm_reports',JSON.stringify(reports));
    localStorage.setItem('cm_usb',JSON.stringify(usbJobs));
    localStorage.setItem('cm_wallet',JSON.stringify(walletTx));
    localStorage.setItem('cm_udhaar',JSON.stringify(udhaarList));
    localStorage.setItem('cm_expenses',JSON.stringify(expenses));
    localStorage.setItem('cm_balances',JSON.stringify(balances));
    localStorage.setItem('cm_balanceTx',JSON.stringify(balanceTx));
    localStorage.setItem('cm_finExp',JSON.stringify(finExpenses));
    localStorage.setItem('cm_purchases',JSON.stringify(purchases));
  }catch(e){}
}
function loadLocal(){
  try{
    inventory=JSON.parse(localStorage.getItem('cm_inv')||'[]');
    sales=JSON.parse(localStorage.getItem('cm_sales')||'[]');
    reports=JSON.parse(localStorage.getItem('cm_reports')||'{}');
    usbJobs=JSON.parse(localStorage.getItem('cm_usb')||'[]');
    walletTx=JSON.parse(localStorage.getItem('cm_wallet')||'[]');

// ── UTILS ──
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function fmt(n){return 'Rs '+Math.round(n||0).toLocaleString();}
function fmtS(n){return Math.round(n||0).toLocaleString();}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function normDate(v){if(!v)return'';if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');const s=String(v);if(s.includes('T')){const d=new Date(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}return s.slice(0,10);}
function catEmoji(cat){return CAT_EMOJI[cat]||'📦';}
function dayLabel(date){const d=new Date(date+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);const diff=Math.round((now-d)/86400000);return diff===0?'Today':diff===1?'Yesterday':`${d.getDate()} ${MONTHS[d.getMonth()]}`;}
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getMonthStr(date){return String(date).slice(0,7);}
function getCurrentMonthStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function getMonthLabel(ym){const[y,m]=ym.split('-');return `${MONTHS[parseInt(m)-1]} ${y}`;}

// ── SYNC ──
function setSyncStatus(s,t){document.getElementById('syncBtn').className='tb-btn '+s;document.getElementById('syncTxt').textContent=t;}
async function syncAll(){
  if(isSyncing)return;isSyncing=true;setSyncStatus('warn','Syncing...');
  try{
    const all=await apiFetch({action:'getAll'});
    if(all&&all.success&&all.items!==undefined){
      inventory=all.items||[];sales=all.sales||[];reports=all.reports||reports;
      usbJobs=all.jobs||[];walletTx=all.txs||[];udhaarList=all.entries||[];expenses=all.exps||[];
      saveLocal();updateSummary();renderTab();setSyncStatus('ok','Synced ✓');fetchFinExpenses();isSyncing=false;return;
    }
  }catch(e){}
  const acts=['getInventory','getSales','getReports','getUSB','getWallets','getUdhaar','getExpenses'];
  const res=await Promise.allSettled(acts.map(a=>apiFetch({action:a})));
  const get=i=>res[i].status==='fulfilled'?res[i].value:null;
  let ok=0;
  const[invD,salesD,repD,usbD,walletD,udhaarD,expD]=[get(0),get(1),get(2),get(3),get(4),get(5),get(6)];
  if(invD&&invD.success){inventory=invD.items||[];ok++;}
  if(salesD&&salesD.success){sales=salesD.sales||[];ok++;}
  if(repD&&repD.success){reports=repD;ok++;}
  if(usbD&&usbD.success){usbJobs=usbD.jobs||[];ok++;}
  if(walletD&&walletD.success){walletTx=walletD.txs||[];ok++;}
  if(udhaarD&&udhaarD.success){udhaarList=udhaarD.entries||[];ok++;}
  if(expD&&expD.success){expenses=expD.exps||[];ok++;}
  saveLocal();updateSummary();renderTab();
  if(ok===acts.length)setSyncStatus('ok','Synced ✓');
  else if(ok>0){setSyncStatus('ok','Synced ✓');toast(ok+'/'+acts.length+' loaded');}
  else{setSyncStatus('warn','Offline');toast('Offline — working locally',4000);}
  fetchFinExpenses();isSyncing=false;
}

// ── DAILY STATS ──
function getDailyStats(){
  const today=todayStr();
  const isToday=v=>normDate(v)===today;
  const todaySales=sales.filter(s=>isToday(s.date));
  const productRevenue=todaySales.reduce((a,s)=>a+parseFloat(s.totalSale||0),0);
  const productProfit=todaySales.reduce((a,s)=>a+parseFloat(s.totalProfit||0),0);
  const customerSet=new Set();
  todaySales.forEach(s=>{if(s.customerName&&s.customerName.trim())customerSet.add(s.customerName.trim().toLowerCase());});
  usbJobs.filter(j=>isToday(j.date)).forEach(j=>{if(j.customer&&j.customer.trim())customerSet.add(j.customer.trim().toLowerCase());});
  walletTx.filter(t=>isToday(t.date)).forEach(t=>{if(t.desc&&t.desc.trim()&&t.desc!=='Commission')customerSet.add(t.desc.trim().toLowerCase());});
  const namedCount=customerSet.size;
  const anonSales=todaySales.filter(s=>!s.customerName||!s.customerName.trim()).length;
  const anonJobs=usbJobs.filter(j=>isToday(j.date)&&(!j.customer||!j.customer.trim())).length;
  const totalCustomers=namedCount+anonSales+anonJobs;
  const usbOnly=usbJobs.filter(j=>isToday(j.date)&&!String(j.desc||'').startsWith('[Repair]')).reduce((a,j)=>a+parseFloat(j.profit||0),0);
  const repair=usbJobs.filter(j=>isToday(j.date)&&String(j.desc||'').startsWith('[Repair]')).reduce((a,j)=>a+parseFloat(j.profit||0),0);
  const walletP=walletTx.filter(t=>isToday(t.date)).reduce((a,t)=>a+parseFloat(t.profit||0),0);
  const expToday=expenses.filter(e=>isToday(e.date)).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const finExpToday=finExpenses.filter(e=>isToday(e.date)).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const netProfit=productProfit+repair+usbOnly+walletP-expToday-finExpToday;
  return{productRevenue,productProfit,totalCustomers,usbToday:usbOnly,repairToday:repair,walletToday:walletP,expToday,finExpToday,netProfit,txCount:todaySales.length};
}

  if(existing){
    if(existing.qty<parseInt(item.quantity)){existing.qty++;toast(`${item.name} qty updated (${existing.qty})`);}
    else{toast('Max stock reached ⚠️');return;}
  }else{
    cart.push({itemId:Number(itemId),name:item.name,category:item.category,qty:1,salePrice:parseFloat(item.salePrice),purchasePrice:parseFloat(item.purchasePrice),maxQty:parseInt(item.quantity)});
    toast(`${item.name} added to cart ✓`);
  }
  updateCartBadge();
  if(activeTab==='sell')renderSellItems();
}
function removeFromCart(itemId){cart=cart.filter(c=>c.itemId!==Number(itemId));updateCartBadge();renderTab();}
function updateCartQty(itemId,delta){
  const item=cart.find(c=>c.itemId===Number(itemId));if(!item)return;
  item.qty+=delta;
  if(item.qty<=0){cart=cart.filter(c=>c.itemId!==Number(itemId));}
  else if(item.qty>item.maxQty){item.qty=item.maxQty;toast('Max stock reached ⚠️');}
  updateCartBadge();renderTab();
}

  document.getElementById('cart-wallet').value=w;

async function checkoutCart(){
  if(!cart.length){toast('Cart is empty ⚠️');return;}
  const customerName=(document.getElementById('cart-customer')?.value||'').trim();
  const wallet=document.getElementById('cart-wallet')?.value||'cash';
  toast('Processing...');
  let successCount=0;
  for(const cartItem of cart){
    const inv=inventory.find(i=>Number(i.id)===Number(cartItem.itemId));
    const totalSaleAmt=cartItem.salePrice*cartItem.qty;
    const totalProfit=(cartItem.salePrice-cartItem.purchasePrice)*cartItem.qty;
    try{
      const d=await apiPost({action:'addSale',itemId:cartItem.itemId,quantity:cartItem.qty,customerName,salePrice:cartItem.salePrice});
      if(d.success){
        successCount++;
        addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name+' x'+cartItem.qty+(customerName?' to '+customerName:''));
      }else{
        if(inv)inv.quantity=Math.max(0,parseInt(inv.quantity)-cartItem.qty);
        sales.push({id:Date.now()+successCount,date:todayStr(),itemId:cartItem.itemId,itemName:cartItem.name,category:cartItem.category,quantity:cartItem.qty,purchasePrice:cartItem.purchasePrice,salePrice:cartItem.salePrice,totalSale:totalSaleAmt,totalProfit,customerName});
        addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name);
        successCount++;
      }
    }catch(e){
      if(inv)inv.quantity=Math.max(0,parseInt(inv.quantity)-cartItem.qty);
      sales.push({id:Date.now()+successCount,date:todayStr(),itemId:cartItem.itemId,itemName:cartItem.name,category:cartItem.category,quantity:cartItem.qty,purchasePrice:cartItem.purchasePrice,salePrice:cartItem.salePrice,totalSale:totalSaleAmt,totalProfit,customerName});
      addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name);
      successCount++;
    }
  }
  saveLocal();cart=[];updateCartBadge();
  await syncAll();toast(`${successCount} item(s) sold ✅`);
}
function addToWalletBalance(wallet,amount,desc){
  if(wallet==='cash')addToCashBalance(amount,desc);
  else if(wallet==='jazz')addToJazzBalance(amount,desc);
  else if(wallet==='easy')addToEasyBalance(amount,desc);
  else if(wallet==='bank')addToBankBalance(amount,desc);
}

async function addExpense(){

  const amount=parseFloat(document.getElementById('exp-amount')?.value);
  const desc=document.getElementById('exp-desc')?.value.trim()||'';
  if(isNaN(amount)||amount<=0){toast('Enter amount ⚠️');return;}
  toast('Saving...');
  try{
    const d=await apiPost({action:'addExpense',category,amount,desc});
    if(d.success){deductFromCashBalance(amount,'Expense: '+(desc||category));await syncAll();toast('Expense added ✅');}
    else{expenses.push({id:Date.now(),category,amount,desc,date:todayStr()});saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');}
  }catch(e){expenses.push({id:Date.now(),category,amount,desc,date:todayStr()});saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');}
}
async function deleteExpense(id){
  const e=expenses.find(x=>x.id==id);if(!e)return;
  if(!confirm(`Delete expense: ${e.desc||e.category} (${fmt(e.amount)})?`))return;
  expenses=expenses.filter(x=>x.id!=id);saveLocal();updateSummary();renderTab();toast('Deleting...');
  try{const r=await apiPost({action:'deleteExpense',id});if(!r.success)throw new Error();toast('Deleted ✅');}
  catch(e){toast('Deleted locally ⚠️',4000);}
}

function showBalanceEditModal(wallet){
  const names={cash:'💵 Cash',jazz:'📲 JazzCash',easy:'💚 EasyPaisa',bank:'🏦 Bank'};
  const cur=balances[wallet]||0;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal"><div class="modal-handle"></div><div class="modal-title">${names[wallet]} — Set Balance</div><div class="modal-sub">Current: ${fmt(cur)}</div><div class="ff" style="margin-bottom:12px"><label style="font-size:11px;color:var(--mu);text-transform:uppercase;margin-bottom:4px;display:block">Balance (Rs)</label><input class="qty-in" type="number" id="bal-edit-val" value="${cur}" inputmode="numeric"/></div><button class="btn pri" onclick="confirmBalanceEdit('${wallet}')">✓ Set Balance</button><div class="btn-gap"></div><button class="btn sec" onclick="document.getElementById('modal').innerHTML=''">Cancel</button></div></div>`;
  setTimeout(()=>{const el=document.getElementById('bal-edit-val');if(el){el.focus();el.select();}},100);
}
function confirmBalanceEdit(wallet){
  const val=parseFloat(document.getElementById('bal-edit-val')?.value)||0;
  const old=balances[wallet]||0;const diff=val-old;
  balances[wallet]=val;
  if(diff!==0)balanceTx.push({type:diff>0?'in':'out',wallet,amount:Math.abs(diff),desc:'Manual adjustment',date:todayStr(),ts:Date.now()});
  saveLocal();document.getElementById('modal').innerHTML='';renderTab();toast('Balance updated ✅');
}
function addBalanceTx(){
  const wallet=document.getElementById('b-wallet')?.value;
  const type=document.getElementById('b-type')?.value;
  const amount=parseFloat(document.getElementById('b-amount')?.value);
  const note=document.getElementById('b-note')?.value.trim()||'Manual entry';
  if(isNaN(amount)||amount<=0){toast('Enter amount ⚠️');return;}
  if(type==='in')balances[wallet]=(balances[wallet]||0)+amount;
  else balances[wallet]=(balances[wallet]||0)-amount;
  balanceTx.push({type,wallet,amount,desc:note,date:todayStr(),ts:Date.now()});
  saveLocal();renderTab();toast(type==='in'?'Added ✅':'Deducted ✅');
}
function deductFinExpenses(){
  const finTotal=finExpenses.reduce((a,e)=>a+parseFloat(e.amount||0),0);
  if(!finTotal){toast('No finance expenses ⚠️');return;}
  if(!confirm(`Deduct ${fmt(finTotal)} from cash?`))return;
  balances.cash=(balances.cash||0)-finTotal;
  balanceTx.push({type:'out',wallet:'cash',amount:finTotal,desc:'Finance Tracker deducted',date:todayStr(),ts:Date.now()});
  saveLocal();renderTab();toast('Deducted ✅');
}

    !allSales.length?`<div class="empty"><div class="empty-icon">📋</div><div class="empty-text">No sales yet</div></div>`:

      const dt=items.reduce((a,s)=>a+parseFloat(s.totalSale||0),0);
      const dp=items.reduce((a,s)=>a+parseFloat(s.totalProfit||0),0);
      return `<div style="margin-bottom:18px">

async function deleteSale(id){
  const s=sales.find(x=>x.id==id);if(!s)return;
  if(!confirm(`Delete sale: ${s.itemName} (${fmt(s.totalSale)})?`))return;
  const inv=inventory.find(i=>i.id==s.itemId||i.name===s.itemName);
  if(inv)inv.quantity=(parseInt(inv.quantity)||0)+(parseInt(s.quantity)||1);
  sales=sales.filter(x=>x.id!=id);saveLocal();updateSummary();renderTab();toast('Deleting...');
  try{const r=await apiPost({action:'deleteSale',id});if(!r.success)throw new Error();toast('Deleted ✅');}
  catch(e){toast('Deleted locally ⚠️',4000);}
}

// ── REPORTS ──
function build6MonthChart(){
  const bm=reports.byMonth||{};
  const now=new Date();
  const cols=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    const lbl=MONTHS[d.getMonth()]+' '+d.getFullYear();
    const data=bm[lbl]||{};
    cols.push({short:MONTHS[d.getMonth()].slice(0,3),profit:data.profit||0,cur:i===0});
  }
  const maxP=Math.max(...cols.map(c=>c.profit),1);
  return `<div class="fcard" style="margin-bottom:12px">
    <div class="ftitle">6-Month Profit Trend</div>
    <div class="chart6-bars">${cols.map(col=>{
      const h=Math.max(3,Math.round(col.profit/maxP*64));
      return `<div class="c6col">
        <div class="c6val">${col.profit>0?Math.round(col.profit/1000)+'k':''}</div>
        <div class="c6bar ${col.cur?'cur':'old'}" style="height:${h}px"></div>
        <div class="c6lbl">${col.short}</div>
      </div>`;
    }).join('')}</div>
  </div>`;
}

async function addItem(){
  const name=document.getElementById('i-name')?.value.trim();
  const cat=document.getElementById('i-cat')?.value;
  const buy=parseFloat(document.getElementById('i-buy')?.value);
  const sell=parseFloat(document.getElementById('i-sell')?.value);
  const qty=parseInt(document.getElementById('i-qty')?.value);
  const alertQty=parseInt(document.getElementById('i-alert')?.value)||5;
  if(!name||isNaN(buy)||isNaN(sell)||isNaN(qty)){toast('Fill all fields ⚠️');return;}
  if(sell<buy){toast('Sale price must be higher ⚠️');return;}
  toast('Adding...');
  try{
    const d=await apiPost({action:'addItem',name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});
    if(d.success){await syncAll();setTab('inventory');toast('Item added ✅');}
    else{inventory.push({id:Date.now(),name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});saveLocal();updateSummary();setTab('inventory');toast('Saved locally ⚠️');}
  }catch(e){inventory.push({id:Date.now(),name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});saveLocal();updateSummary();setTab('inventory');toast('Saved locally ⚠️');}
}

function showSellModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const defPrice=parseFloat(item.salePrice)||0;
  const buyPrice=parseFloat(item.purchasePrice)||0;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">${escHtml(item.name)}</div>
    <div class="modal-sub">${escHtml(item.category)} · ${item.quantity} units in stock</div>
    <div class="modal-info">
      <div class="mii"><div class="mii-lbl">Default Price</div><div class="mii-val">${fmt(defPrice)}</div></div>
      <div class="mii"><div class="mii-lbl">In Stock</div><div class="mii-val">${item.quantity}</div></div>
      <div class="mii"><div class="mii-lbl">Margin</div><div class="mii-val" style="color:var(--ac)">+${fmt(defPrice-buyPrice)}</div></div>
    </div>
    <div class="ff" style="margin-bottom:10px"><label style="font-size:11px;color:var(--mu);text-transform:uppercase;margin-bottom:4px;display:block">Customer Name (optional)</label><input class="qty-in" type="text" id="sell-customer" placeholder="e.g. Ali, Walk-in..." autocomplete="off"/></div>
    <div class="ff" style="margin-bottom:10px"><label style="font-size:11px;color:var(--mu);text-transform:uppercase;margin-bottom:4px;display:block">Quantity</label><input class="qty-in" type="number" id="sell-qty" value="1" min="1" max="${item.quantity}" inputmode="numeric" oninput="updateSellMargin(${buyPrice})"/></div>
    <div class="ff" style="margin-bottom:6px"><label style="font-size:11px;color:var(--mu);text-transform:uppercase;margin-bottom:4px;display:block">Sale Price (Rs)</label><input class="qty-in" type="number" id="sell-price" value="${defPrice}" inputmode="numeric" oninput="updateSellMargin(${buyPrice})"/></div>
    <div class="bargain-hint" id="sell-margin-hint" style="margin-bottom:12px">Margin: <span style="color:var(--ac);font-weight:700">+${fmt(defPrice-buyPrice)}</span> per unit · Total: <span style="color:var(--ac)">${fmt(defPrice)}</span></div>
    <div style="font-size:11px;color:var(--mu);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Payment to wallet:</div>
    <div class="wsel" id="sell-wsel">
      <div class="wsel-btn active" id="sw-cash" onclick="selectSellWallet('cash')"><span class="wi">💵</span><span class="wn">Cash</span></div>
      <div class="wsel-btn" id="sw-jazz" onclick="selectSellWallet('jazz')"><span class="wi">📲</span><span class="wn">Jazz</span></div>
      <div class="wsel-btn" id="sw-easy" onclick="selectSellWallet('easy')"><span class="wi">💚</span><span class="wn">Easy</span></div>
      <div class="wsel-btn" id="sw-bank" onclick="selectSellWallet('bank')"><span class="wi">🏦</span><span class="wn">Bank</span></div>
    </div>
    <input type="hidden" id="sell-wallet" value="cash"/>
    <button class="btn pri" onclick="confirmSell(${item.id})">✓ Confirm Sale</button>
    <div class="btn-gap"></div>
    <button class="btn sec" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div></div>`;
  setTimeout(()=>document.getElementById('sell-qty')?.select(),100);
}
function selectSellWallet(w){
  document.getElementById('sell-wallet').value=w;
  ['cash','jazz','easy','bank'].forEach(x=>{const el=document.getElementById('sw-'+x);if(el)el.className='wsel-btn'+(x===w?' active':'');});
}
function updateSellMargin(buyPrice){
  const sp=parseFloat(document.getElementById('sell-price')?.value)||0;
  const qty=parseInt(document.getElementById('sell-qty')?.value)||1;
  const margin=sp-buyPrice;
  const hint=document.getElementById('sell-margin-hint');
  if(hint){const c=margin>=0?'var(--ac)':'var(--rd)';hint.innerHTML=`Margin: <span style="color:${c};font-weight:700">${margin>=0?'+':''}${fmt(margin)}</span> per unit · Total: <span style="color:var(--ac)">${fmt(sp*qty)}</span>`;}
}
function showRestockModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Restock: ${escHtml(item.name)}</div>
    <div class="modal-sub">Current stock: ${item.quantity} units</div>
    <div class="fgrid" style="margin-bottom:12px">
      <div class="ff"><label>Add Quantity</label><input class="qty-in" type="number" id="rs-qty" value="10" min="1" inputmode="numeric"/></div>
      <div class="ff"><label>Purchase Price/unit (Rs)</label><input class="qty-in" type="number" id="rs-price" value="${item.purchasePrice}" inputmode="numeric"/></div>
      <div class="ff"><label>Supplier Name (optional)</label><input class="qty-in" type="text" id="rs-supplier" placeholder="e.g. Ali Traders"/></div>
      <div class="ff"><label>Note (optional)</label><input class="qty-in" type="text" id="rs-note" placeholder="e.g. Bulk purchase"/></div>
    </div>
    <button class="btn pri" onclick="confirmRestock(${item.id})">✓ Add Stock</button>
    <div class="btn-gap"></div>
    <button class="btn sec" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div></div>`;
}
function showEditModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const catOpts=CATS.map(cat=>`<option value="${cat}" ${item.category===cat?'selected':''}>${catEmoji(cat)} ${cat}</option>`).join('');
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">✏️ Edit: ${escHtml(item.name)}</div>
    <div class="modal-sub">Update fields and save</div>
    <div class="fgrid" style="margin-bottom:12px">
      <div class="ff full"><label>Item Name</label><input class="qty-in" type="text" id="edit-name" value="${escHtml(item.name)}"/></div>
      <div class="ff full"><label>Category</label><select class="qty-in" id="edit-cat" style="font-size:14px">${catOpts}</select></div>
      <div class="ff"><label>Purchase Price (Rs)</label><input class="qty-in" type="number" id="edit-buy" value="${item.purchasePrice}" inputmode="numeric"/></div>
      <div class="ff"><label>Sale Price (Rs)</label><input class="qty-in" type="number" id="edit-sell" value="${item.salePrice}" inputmode="numeric"/></div>
      <div class="ff full"><label>Low Stock Alert</label><input class="qty-in" type="number" id="edit-alert" value="${item.lowStockAlert||5}" inputmode="numeric"/></div>
    </div>
    <button class="btn pri" onclick="confirmEdit(${item.id})">✓ Save Changes</button>
    <div class="btn-gap"></div>
    <button class="btn sec" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div></div>`;
}
function closeModal(e){if(e.target.classList.contains('modal-bg'))document.getElementById('modal').innerHTML='';}

// ── ACTIONS ──
async function confirmSell(id){
  // track for quick sell
  try{let r=JSON.parse(localStorage.getItem('cm_recent_sold')||'[]');r=r.filter(x=>x!==Number(id));r.unshift(Number(id));localStorage.setItem('cm_recent_sold',JSON.stringify(r.slice(0,8)));}catch{}
  const qty=parseInt(document.getElementById('sell-qty')?.value);
  const customerName=(document.getElementById('sell-customer')?.value||'').trim();
  const sellWallet=document.getElementById('sell-wallet')?.value||'cash';
  const item=inventory.find(i=>Number(i.id)===Number(id));
  const actualPrice=parseFloat(document.getElementById('sell-price')?.value)||parseFloat(item?.salePrice||0);
  if(!qty||qty<1){toast('Enter valid quantity ⚠️');return;}
  if(item&&qty>parseInt(item.quantity)){toast('Not enough stock! Only '+item.quantity+' left ⚠️');return;}
  document.getElementById('modal').innerHTML='';toast('Recording sale...');
  const totalSaleAmt=actualPrice*qty;
  const buyP=parseFloat(item?.purchasePrice||0);
  const totalProfit=(actualPrice-buyP)*qty;
  try{
    const d=await apiPost({action:'addSale',itemId:id,quantity:qty,customerName,salePrice:actualPrice});
    if(d.success){addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item')+' x'+qty+(customerName?' to '+customerName:''));await syncAll();toast('Sale recorded ✅');}
    else{
      if(item)item.quantity=Math.max(0,parseInt(item.quantity)-qty);
      sales.push({id:Date.now(),date:todayStr(),itemId:id,itemName:item?.name||'',category:item?.category||'',quantity:qty,purchasePrice:buyP,salePrice:actualPrice,totalSale:totalSaleAmt,totalProfit,customerName});
      addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item'));
      saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');
    }
  }catch(e){
    if(item)item.quantity=Math.max(0,parseInt(item.quantity)-qty);
    sales.push({id:Date.now(),date:todayStr(),itemId:id,itemName:item?.name||'',category:item?.category||'',quantity:qty,purchasePrice:buyP,salePrice:actualPrice,totalSale:totalSaleAmt,totalProfit,customerName});
    addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item'));
    saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');
  }
}
async function confirmRestock(id){
  const addQty=parseInt(document.getElementById('rs-qty')?.value);
  const unitPrice=parseFloat(document.getElementById('rs-price')?.value)||0;
  const supplier=(document.getElementById('rs-supplier')?.value||'').trim();
  const note=(document.getElementById('rs-note')?.value||'').trim();
  if(!addQty||addQty<1){toast('Enter valid quantity ⚠️');return;}
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const newQty=parseInt(item.quantity)+addQty;
  const totalCost=unitPrice*addQty;
  // Save purchase record locally
  purchases.push({id:Date.now(),itemId:Number(id),itemName:item.name,supplierName:supplier,qty:addQty,unitPrice,totalCost,date:todayStr(),note});
  document.getElementById('modal').innerHTML='';toast('Restocking...');
  try{
    const d=await apiPost({action:'updateQuantity',id,quantity:newQty});
    if(d.success){await syncAll();toast('Stock updated ✅');}
    else{item.quantity=newQty;saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
  }catch(e){item.quantity=newQty;saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
}
async function confirmEdit(id){
  const name=document.getElementById('edit-name')?.value.trim();
  const category=document.getElementById('edit-cat')?.value;
  const purchasePrice=parseFloat(document.getElementById('edit-buy')?.value);
  const salePrice=parseFloat(document.getElementById('edit-sell')?.value);
  const lowStockAlert=parseInt(document.getElementById('edit-alert')?.value)||5;
  if(!name||isNaN(purchasePrice)||isNaN(salePrice)){toast('Fill all fields ⚠️');return;}
  if(salePrice<purchasePrice){toast('Sale price must be higher ⚠️');return;}
  document.getElementById('modal').innerHTML='';toast('Saving...');
  try{
    const d=await apiPost({action:'updateItem',id,name,category,purchasePrice,salePrice,lowStockAlert});
    if(d.success){await syncAll();toast('Item updated ✅');}
    else{const it=inventory.find(i=>Number(i.id)===Number(id));if(it)Object.assign(it,{name,category,purchasePrice,salePrice,lowStockAlert});saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
  }catch(e){const it=inventory.find(i=>Number(i.id)===Number(id));if(it)Object.assign(it,{name,category,purchasePrice,salePrice,lowStockAlert});saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
}
async function deleteItem(id){
  if(!confirm('Delete this item?'))return;
  inventory=inventory.filter(i=>Number(i.id)!==Number(id));saveLocal();updateSummary();renderTab();toast('Deleting...');
  try{const r=await apiPost({action:'deleteItem',id});if(!r.success)throw new Error();toast('Deleted ✅');}
  catch(e){toast('Deleted locally ⚠️',4000);}
}

// ── BOOT ──
loadLocal();updateSummary();initApp();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{if(nw.state==='activated'){toast('App updated! Reloading...',1500);setTimeout(()=>window.location.reload(true),1500);}});
    });
    reg.update();
  }).catch(()=>{});
}

// ── MORE DRAWER ──
const MORE_TABS=['cart','usb','kharcha','sales','reports','inventory','addItem','settings'];
function openMore(){
  document.getElementById('more-overlay').classList.add('open');
  MORE_TABS.forEach(t=>{const el=document.getElementById('mg-'+t);if(el)el.classList.toggle('on',activeTab===t);});
}
function closeMore(){document.getElementById('more-overlay').classList.remove('open');}
function openFromMore(tab){
  closeMore();
  document.querySelectorAll('.ni').forEach(b=>b.classList.remove('on'));
  const mb=document.getElementById('more-nav-btn');if(mb)mb.classList.add('on');
  setTab(tab,null);
}

// ── LOW STOCK BADGE ──
function updateLowStockBadge(){
  const count=inventory.filter(i=>parseInt(i.quantity)>0&&parseInt(i.quantity)<=3).length;
  let dot=document.getElementById('low-stock-dot');
  const mb=document.getElementById('more-nav-btn');
  if(!mb)return;
  if(count>0){
    if(!dot){dot=document.createElement('span');dot.id='low-stock-dot';dot.className='nav-dot';mb.style.position='relative';mb.appendChild(dot);}
  }else if(dot){dot.remove();}
}

// ── PULL TO REFRESH ──
function initPullToRefresh(){
  const cont=document.getElementById('content');
  if(!cont||cont._ptr)return;
  cont._ptr=true;
  let sy=0,pulling=false,ptrel=null;
  cont.addEventListener('touchstart',e=>{if(cont.scrollTop===0){sy=e.touches[0].clientY;pulling=true;}},{passive:true});
  cont.addEventListener('touchmove',e=>{
    if(!pulling)return;
    const dy=e.touches[0].clientY-sy;
    if(dy>55&&cont.scrollTop===0){
      if(!ptrel){ptrel=document.createElement('div');ptrel.className='ptr';ptrel.innerHTML='<span class="ptr-spin">↻</span> Release to refresh';cont.prepend(ptrel);}
      ptrel.classList.add('show');
    }
  },{passive:true});
  cont.addEventListener('touchend',()=>{
    if(pulling&&ptrel&&ptrel.classList.contains('show')){
      ptrel.innerHTML='<span class="ptr-spin">↻</span> Refreshing...';
      syncAll();
      setTimeout(()=>{if(ptrel){ptrel.classList.remove('show');setTimeout(()=>{ptrel?.remove();ptrel=null;},250);}},1600);
    }else if(ptrel){ptrel.classList.remove('show');setTimeout(()=>{ptrel?.remove();ptrel=null;},200);}
    pulling=false;
  },{passive:true});
}

// ── SWIPE TO DELETE ──
function initSwipeDel(wrap,onDel){
  if(wrap._sw)return;wrap._sw=true;
  const inner=wrap.querySelector('.sw-inner');if(!inner)return;
  let sx=0,cx=0,sw=false;
  wrap.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;cx=0;sw=true;inner.classList.remove('snap');},{passive:true});
  wrap.addEventListener('touchmove',e=>{if(!sw)return;cx=e.touches[0].clientX-sx;if(cx<0)inner.style.transform=`translateX(${Math.max(cx,-72)}px)`;},{passive:true});
  wrap.addEventListener('touchend',()=>{
    sw=false;inner.classList.add('snap');
    if(cx<-40)inner.style.transform='translateX(-72px)';
    else inner.style.transform='';
  },{passive:true});
  const bg=wrap.querySelector('.sw-del-bg');if(bg)bg.addEventListener('click',onDel);
}
function applySwipeDel(){
  document.querySelectorAll('.sw-wrap[data-del]').forEach(w=>{
    initSwipeDel(w,()=>eval(w.dataset.del));
  });
}
