<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="theme-color" content="#0a0a0a"/>
<title>Chouhdary Mobiles</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-title" content="CM Shop"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root{--bg:#0a0a0a;--surface:#141414;--surface2:#1e1e1e;--surface3:#282828;--border:#2a2a2a;--border2:#383838;--text:#f2f2f2;--text2:#a0a0a0;--muted:#666;--accent:#c8f564;--accent-dim:#c8f56420;--accent-border:#c8f56440;--danger:#ff5f5f;--danger-dim:#ff5f5f18;--warning:#ffb347;--warning-dim:#ffb34720;--success:#4ade80;--success-dim:#4ade8018;--blue:#60a5fa;--blue-dim:#60a5fa18;--purple:#a78bfa;--purple-dim:#a78bfa18;--gold:#f9a825;--font:'Inter',-apple-system,sans-serif;--mono:'SF Mono','Fira Code',monospace;--r:16px;--rs:10px;--rx:8px;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--font);overscroll-behavior:none;}

/* PIN */
.pin-screen{position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 24px;}
.pin-logo{font-size:52px;margin-bottom:8px;}
.pin-shopname{font-size:20px;font-weight:800;}
.pin-sub{font-size:12px;color:var(--muted);margin-top:4px;margin-bottom:36px;}
.pin-title{font-size:14px;color:var(--text2);margin-bottom:22px;font-weight:500;}
.pin-dots{display:flex;gap:16px;margin-bottom:32px;}
.pin-dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--border2);background:transparent;transition:all .2s;}
.pin-dot.filled{background:var(--accent);border-color:var(--accent);transform:scale(1.15);}
.pin-dot.error{background:var(--danger);border-color:var(--danger);}
.pin-pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:256px;}
.pin-btn{height:70px;border-radius:var(--r);background:var(--surface);border:1px solid var(--border);font-size:22px;font-weight:600;color:var(--text);cursor:pointer;transition:all .15s;display:flex;align-items:center;justify-content:center;font-family:var(--font);}
.pin-btn:active{background:var(--surface3);transform:scale(.95);}
.pin-btn.del{font-size:18px;color:var(--muted);}
.pin-btn.empty{background:transparent;border-color:transparent;pointer-events:none;}
.pin-err{font-size:12px;color:var(--danger);margin-top:14px;min-height:16px;text-align:center;}
.pin-forgot{background:none;border:none;color:var(--muted);font-size:12px;margin-top:18px;cursor:pointer;font-family:var(--font);}

/* APP */
.app{display:flex;flex-direction:column;height:100dvh;max-width:600px;margin:0 auto;}
.header{padding:48px 16px 12px;flex-shrink:0;}
.header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.shop-logo{width:38px;height:38px;border-radius:11px;background:var(--accent-dim);border:1px solid var(--accent-border);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.shop-info{margin-left:10px;}
.shop-name{font-size:16px;font-weight:800;}
.shop-ver{font-size:10px;color:var(--muted);}
.header-right{display:flex;align-items:center;gap:8px;}
.cart-fab{position:relative;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:8px 12px;font-size:18px;cursor:pointer;transition:all .2s;}
.cart-fab:active{background:var(--surface3);}
.cart-count{position:absolute;top:-5px;right:-5px;background:var(--accent);color:#0a0a0a;font-size:9px;font-weight:800;border-radius:10px;min-width:17px;height:17px;padding:0 4px;display:flex;align-items:center;justify-content:center;}
.sync-btn{display:flex;align-items:center;gap:5px;background:var(--surface);border:1px solid var(--border);border-radius:20px;padding:6px 12px;font-size:11px;color:var(--muted);cursor:pointer;font-family:var(--font);transition:all .2s;}
.sync-btn.ok{color:var(--accent);border-color:var(--accent-border);}
.sync-btn.warn{color:var(--warning);border-color:var(--warning-dim);}
.sdot{width:6px;height:6px;border-radius:50%;background:currentColor;flex-shrink:0;}
.summary-row{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;}
.summary-row::-webkit-scrollbar{display:none;}
.scard{flex-shrink:0;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;min-width:96px;}
.scard-label{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px;white-space:nowrap;}
.scard-val{font-size:15px;font-weight:700;font-family:var(--mono);}
.scard-val.g{color:var(--accent);}.scard-val.o{color:var(--warning);}.scard-val.b{color:var(--blue);}.scard-val.p{color:var(--purple);}.scard-val.r{color:var(--danger);}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:12px 16px 96px;-webkit-overflow-scrolling:touch;}

/* BOTTOM NAV */
.bnav{flex-shrink:0;background:var(--surface);border-top:1px solid var(--border);display:flex;overflow-x:auto;padding-bottom:env(safe-area-inset-bottom,0);}
.bnav::-webkit-scrollbar{display:none;}
.nitem{flex:1;min-width:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:7px 4px 8px;gap:3px;cursor:pointer;color:var(--muted);font-size:10px;font-weight:500;white-space:nowrap;border:none;background:none;font-family:var(--font);border-top:2px solid transparent;margin-top:-1px;transition:color .2s;}
.nitem .ni{font-size:19px;transition:transform .2s;}
.nitem.active{color:var(--accent);border-top-color:var(--accent);}
.nitem.active .ni{transform:scale(1.1);}

/* BANNERS */
.banner{border-radius:var(--r);padding:16px;margin-bottom:12px;border:1px solid var(--border);}
.banner.day{background:linear-gradient(135deg,#0f1a0a,#0a0f1a);}
.banner.mon{background:linear-gradient(135deg,#0f1a2a,#1a0f2a);}
.banner-hd{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;justify-content:space-between;}
.banner-hd span{color:var(--accent);font-weight:600;}
.banner-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.bcell-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;}
.bcell-val{font-size:15px;font-weight:700;font-family:var(--mono);margin-top:2px;}
.bcell-val.g{color:var(--accent);}.bcell-val.b{color:var(--blue);}.bcell-val.w{color:var(--text);}
.banner-div{height:1px;background:var(--border);margin:12px 0;}
.banner-net{display:flex;justify-content:space-between;align-items:center;}
.bnet-val{font-size:20px;font-weight:800;font-family:var(--mono);color:var(--accent);}

/* INV */
.inv-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:10px;}
.inv-top{display:flex;align-items:flex-start;gap:12px;}
.inv-icon{width:44px;height:44px;border-radius:12px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.inv-info{flex:1;min-width:0;}
.inv-name{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.inv-cat{font-size:11px;color:var(--text2);margin-top:3px;display:flex;align-items:center;gap:6px;}
.inv-right{text-align:right;flex-shrink:0;}
.inv-qty{font-size:20px;font-weight:700;font-family:var(--mono);}
.inv-qty.low{color:var(--warning);}.inv-qty.out{color:var(--danger);}.inv-qty.ok{color:var(--accent);}
.qty-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;}
.inv-bot{display:flex;align-items:center;justify-content:space-between;margin-top:12px;padding-top:12px;border-top:1px solid var(--border);}
.price-pair{display:flex;gap:14px;}
.price-item{display:flex;flex-direction:column;}
.price-lbl{font-size:9px;color:var(--muted);text-transform:uppercase;}
.price-val{font-size:13px;font-weight:600;font-family:var(--mono);}
.price-val.p{color:var(--accent);}
.inv-acts{display:flex;gap:6px;}
.abtn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rx);padding:7px 11px;font-size:12px;font-weight:500;color:var(--text);cursor:pointer;font-family:var(--font);transition:all .15s;}
.abtn:active{background:var(--surface3);}
.abtn.sell{background:var(--accent);color:#0a0a0a;border-color:var(--accent);font-weight:700;}
.abtn.cart{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border);font-weight:600;}
.abtn.del{color:var(--danger);}.abtn.edit{color:var(--blue);}
.badge{display:inline-block;font-size:9px;padding:2px 7px;border-radius:10px;font-weight:600;text-transform:uppercase;}
.badge.low{background:var(--warning-dim);color:var(--warning);}.badge.out{background:var(--danger-dim);color:var(--danger);}
.eye-btn{background:none;border:none;color:var(--muted);cursor:pointer;padding:4px 6px;font-size:15px;user-select:none;}
.eye-btn:active{color:var(--accent);}
.pr-reveal{font-size:12px;font-family:var(--mono);color:var(--warning);background:var(--warning-dim);border:1px solid #ffb34730;border-radius:6px;padding:2px 8px;display:none;}
.pr-reveal.show{display:inline-block;}

/* CART */
.cart-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.ci-icon{font-size:22px;width:42px;height:42px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.ci-info{flex:1;min-width:0;}
.ci-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-price{font-size:11px;color:var(--text2);margin-top:3px;}
.ci-right{display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex-shrink:0;}
.ci-total{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--accent);}
.qty-ctrl{display:flex;align-items:center;gap:8px;}
.qc-btn{width:28px;height:28px;border-radius:var(--rx);background:var(--surface2);border:1px solid var(--border);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);transition:all .15s;}
.qc-btn:active{background:var(--surface3);}
.qc-btn.rem{color:var(--danger);}
.qc-num{font-size:14px;font-weight:700;font-family:var(--mono);min-width:20px;text-align:center;}
.ci-price-in{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rx);padding:5px 8px;font-size:13px;font-family:var(--mono);color:var(--text);width:88px;text-align:right;outline:none;}
.ci-price-in:focus{border-color:var(--accent);}
.cart-sum{background:var(--surface);border:1px solid var(--accent-border);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.cs-row{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;color:var(--text2);}
.cs-total{font-size:20px;font-weight:800;font-family:var(--mono);color:var(--accent);}

/* PURCHASE HISTORY */
.pur-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--r);padding:13px;margin-bottom:8px;}
.pur-name{font-size:14px;font-weight:600;}
.pur-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.pur-cost{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--blue);}

/* FORMS */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:18px;margin-bottom:12px;}
.form-title{font-size:12px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.08em;margin-bottom:16px;}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;}
.form-field{display:flex;flex-direction:column;gap:5px;}
.form-field.full{grid-column:1/-1;}
.form-field label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;}
.form-field input,.form-field select,.form-field textarea{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:11px 13px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;width:100%;-webkit-appearance:none;transition:border-color .2s;}
.form-field input:focus,.form-field select:focus,.form-field textarea:focus{border-color:var(--accent);}
.form-field input::placeholder,.form-field textarea::placeholder{color:var(--muted);}
.btn{width:100%;padding:14px;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;font-family:var(--font);cursor:pointer;transition:all .15s;}
.btn:active{opacity:.85;transform:scale(.99);}
.btn.primary{background:var(--accent);color:#0a0a0a;}
.btn.secondary{background:var(--surface2);color:var(--text);border:1px solid var(--border);}
.btn.blue{background:var(--blue);color:#0a0a0a;}
.btn.purple{background:var(--purple);color:#0a0a0a;}
.btn.danger{background:var(--danger);color:#fff;}
.btn.warning{background:var(--warning);color:#0a0a0a;}
.btn-gap{height:8px;}

/* SALE ITEMS */
.sale-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:12px;}
.si-icon{width:40px;height:40px;border-radius:10px;background:var(--accent-dim);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
.si-info{flex:1;min-width:0;}
.si-name{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.si-meta{font-size:11px;color:var(--text2);margin-top:2px;}
.si-right{text-align:right;flex-shrink:0;}
.si-amt{font-size:14px;font-weight:700;font-family:var(--mono);color:var(--accent);}
.si-profit{font-size:11px;color:var(--success);}
.del-btn{background:none;border:none;color:var(--danger);font-size:14px;cursor:pointer;padding:4px;opacity:.7;display:block;margin-left:auto;margin-top:2px;}
.del-btn:active{opacity:1;}

/* UDHAAR */
.udhaar-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--warning);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.udhaar-item.paid{border-left-color:var(--success);opacity:.55;}
.ud-customer{font-size:14px;font-weight:600;}
.ud-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.ud-amount{font-size:18px;font-weight:800;font-family:var(--mono);color:var(--warning);}
.ud-amount.p{color:var(--success);}
.ud-status{font-size:10px;font-weight:700;text-transform:uppercase;padding:2px 9px;border-radius:20px;display:inline-block;}
.ud-status.pen{background:var(--warning-dim);color:var(--warning);}
.ud-status.paid{background:var(--success-dim);color:var(--success);}

/* USB */
.usb-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--blue);border-radius:var(--r);padding:14px;margin-bottom:8px;}
.usb-desc{font-size:14px;font-weight:500;}
.usb-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.usb-charge{font-size:17px;font-weight:700;font-family:var(--mono);color:var(--blue);}
.usb-profit{font-size:11px;color:var(--success);margin-top:1px;}

/* WALLET */
.wallet-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;}
.wc-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.wc-title{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;}
.wc-bal{font-size:22px;font-weight:800;font-family:var(--mono);}
.wc-bal.jazz{color:var(--purple);}.wc-bal.easy{color:var(--blue);}
.tx-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--border);}
.tx-item:last-child{border-bottom:none;}
.tx-desc{font-size:13px;}
.tx-meta{font-size:11px;color:var(--muted);margin-top:1px;}
.tx-amt{font-size:13px;font-weight:700;font-family:var(--mono);}
.tx-amt.in{color:var(--accent);}.tx-amt.out{color:var(--danger);}

/* EXPENSE */
.exp-item{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--danger);border-radius:var(--r);padding:14px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.exp-left{flex:1;min-width:0;}
.exp-desc{font-size:14px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.exp-meta{font-size:11px;color:var(--text2);margin-top:3px;}
.exp-cat{display:inline-block;font-size:10px;padding:2px 8px;border-radius:8px;background:var(--danger-dim);color:var(--danger);font-weight:600;text-transform:uppercase;margin-top:4px;}
.exp-right{text-align:right;flex-shrink:0;margin-left:12px;}
.exp-amt{font-size:16px;font-weight:700;font-family:var(--mono);color:var(--danger);}

/* BALANCE */
.bal-banner{background:linear-gradient(135deg,#0f1a0a,#0a0f1a);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:12px;}
.bal-title{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;display:flex;justify-content:space-between;}
.bal-title span{color:var(--accent);font-weight:600;}
.bal-wallets{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px;}
.bal-wallet{background:var(--surface2);border-radius:var(--rs);padding:12px;cursor:pointer;border:1px solid var(--border);transition:border-color .2s;}
.bal-wallet:active{border-color:var(--accent);}
.bw-icon{font-size:20px;margin-bottom:5px;}
.bw-name{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
.bw-amt{font-size:16px;font-weight:700;font-family:var(--mono);margin-top:3px;}
.bw-amt.cash{color:var(--accent);}.bw-amt.jazz{color:var(--purple);}.bw-amt.easy{color:var(--blue);}.bw-amt.bank{color:var(--gold);}
.bal-total{display:flex;justify-content:space-between;align-items:center;padding-top:12px;border-top:1px solid var(--border);}
.bal-total-lbl{font-size:12px;color:var(--muted);}
.bal-total-val{font-size:22px;font-weight:800;font-family:var(--mono);color:var(--accent);}

/* REPORTS */
.rep-section{margin-bottom:22px;}
.rep-title{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px;font-weight:600;}
.rep-cards{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.rep-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:14px;}
.rep-card-lbl{font-size:11px;color:var(--text2);margin-bottom:5px;}
.rep-card-val{font-size:21px;font-weight:700;font-family:var(--mono);}
.rep-card-val.g{color:var(--accent);}.rep-card-val.b{color:var(--blue);}.rep-card-val.p{color:var(--purple);}.rep-card-val.r{color:var(--danger);}
.bar-item{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.bar-name{font-size:12px;width:90px;flex-shrink:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.bar-wrap{flex:1;height:6px;background:var(--surface2);border-radius:3px;overflow:hidden;}
.bar-fill{height:6px;border-radius:3px;background:var(--accent);}
.bar-val{font-size:11px;font-family:var(--mono);color:var(--accent);width:70px;text-align:right;flex-shrink:0;}
.month-row{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px;margin-bottom:8px;}

/* SEARCH */
.search-bar{display:flex;gap:8px;margin-bottom:12px;}
.search-in{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 14px;font-size:14px;color:var(--text);font-family:var(--font);outline:none;transition:border-color .2s;}
.search-in:focus{border-color:var(--accent);}
.search-in::placeholder{color:var(--muted);}
.filter-sel{background:var(--surface);border:1px solid var(--border);border-radius:var(--rs);padding:10px 11px;font-size:12px;color:var(--text);font-family:var(--font);outline:none;-webkit-appearance:none;cursor:pointer;}

/* SECTION TABS */
.stabs{display:flex;gap:6px;margin-bottom:12px;}
.stab{flex:1;padding:9px;text-align:center;font-size:12px;font-weight:600;background:var(--surface);border:1px solid var(--border);border-radius:var(--rx);color:var(--muted);cursor:pointer;transition:all .2s;}
.stab.active{background:var(--accent-dim);color:var(--accent);border-color:var(--accent-border);}

/* MODAL */
.modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:100;display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(3px);}
.modal{background:var(--surface);border-radius:24px 24px 0 0;padding:0 20px 48px;width:100%;max-width:600px;max-height:92vh;overflow-y:auto;}
.modal-handle{width:40px;height:4px;background:var(--border2);border-radius:2px;margin:10px auto 20px;}
.modal-title{font-size:17px;font-weight:700;margin-bottom:4px;}
.modal-sub{font-size:12px;color:var(--text2);margin-bottom:16px;}
.modal-info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:16px;}
.mii{background:var(--surface2);border-radius:var(--rs);padding:10px;}
.mii-lbl{font-size:10px;color:var(--muted);text-transform:uppercase;}
.mii-val{font-size:15px;font-weight:700;font-family:var(--mono);margin-top:2px;}
.qty-in{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:12px 14px;font-size:16px;color:var(--text);font-family:var(--font);outline:none;width:100%;transition:border-color .2s;}
.qty-in:focus{border-color:var(--accent);}

/* WALLET SELECTOR */
.wsel{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:14px;}
.wsel-btn{background:var(--surface2);border:1px solid var(--border);border-radius:var(--rs);padding:10px 6px;text-align:center;cursor:pointer;transition:all .2s;}
.wsel-btn .wi{font-size:18px;display:block;margin-bottom:3px;}
.wsel-btn .wn{font-size:9px;color:var(--muted);text-transform:uppercase;}
.wsel-btn.active{border-color:var(--accent);background:var(--accent-dim);}
.wsel-btn.active .wn{color:var(--accent);}

/* MISC */
.customer-chip{display:inline-flex;align-items:center;gap:4px;background:var(--blue-dim);border:1px solid #60a5fa30;border-radius:8px;padding:2px 8px;font-size:10px;color:var(--blue);margin-top:3px;}
.fin-tag{display:inline-block;font-size:9px;padding:1px 6px;border-radius:8px;background:var(--danger-dim);color:var(--danger);font-weight:700;text-transform:uppercase;margin-left:5px;}
.bargain-hint{font-size:11px;color:var(--text2);margin-top:4px;padding:8px 12px;background:var(--surface2);border-radius:var(--rx);border-left:3px solid var(--warning);}
.empty{text-align:center;padding:48px 20px;color:var(--muted);}
.empty-icon{font-size:40px;margin-bottom:10px;}
.empty-text{font-size:14px;}
.divider{height:1px;background:var(--border);margin:14px 0;}
.sec-lbl{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em;margin-bottom:8px;font-weight:600;}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:var(--surface2);border:1px solid var(--border2);border-radius:24px;padding:10px 20px;font-size:13px;color:var(--text);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap;z-index:500;box-shadow:0 4px 24px rgba(0,0,0,.4);}
.toast.show{opacity:1;}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:14px 0;border-bottom:1px solid var(--border);}
.settings-row:last-child{border-bottom:none;}
.sr-icon{width:36px;height:36px;border-radius:10px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;margin-right:12px;}
.sr-title{font-size:14px;font-weight:500;}
.sr-sub{font-size:11px;color:var(--muted);margin-top:2px;}
.sr-action{font-size:12px;color:var(--accent);font-weight:600;cursor:pointer;background:none;border:none;font-family:var(--font);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
</style>
</head>
<body>
<div id="toast" class="toast"></div>
<div id="modal"></div>
<div id="pin-overlay"></div>
<div class="app" id="app" style="display:none">
  <div class="header">
    <div class="header-top">
      <div style="display:flex;align-items:center">
        <div class="shop-logo">📱</div>
        <div class="shop-info">
          <div class="shop-name">Chouhdary Mobiles</div>
          <div class="shop-ver">POS &amp; Inventory · <span style="color:var(--accent)">v4.0</span></div>
        </div>
      </div>
      <div class="header-right">
        <button class="cart-fab" id="cart-fab" onclick="setTab('cart')" style="display:none">🛒<span class="cart-count" id="cart-count">0</span></button>
        <button class="sync-btn ok" id="syncBtn" onclick="syncAll()"><span class="sdot"></span><span id="syncTxt">Synced</span></button>
      </div>
    </div>
    <div class="summary-row">
      <div class="scard"><div class="scard-label">Customers</div><div class="scard-val" id="s-customers">--</div></div>
      <div class="scard"><div class="scard-label">Today Profit</div><div class="scard-val g" id="s-today">--</div></div>
      <div class="scard"><div class="scard-label">Udhaar</div><div class="scard-val o" id="s-udhaar">--</div></div>
      <div class="scard"><div class="scard-label">USB/Repair</div><div class="scard-val b" id="s-usb">--</div></div>
      <div class="scard"><div class="scard-label">Wallets</div><div class="scard-val p" id="s-wallet">--</div></div>
      <div class="scard"><div class="scard-label">Expenses</div><div class="scard-val r" id="s-expense">--</div></div>
    </div>
  </div>
  <div class="content" id="content"></div>
  <nav class="bnav" id="mainNav">
    <button class="nitem active" onclick="setTab('sell',this)" data-tab="sell"><span class="ni">💰</span><span>Sell</span></button>
    <button class="nitem" onclick="setTab('cart',this)" data-tab="cart"><span class="ni">🛒</span><span>Cart</span></button>
    <button class="nitem" onclick="setTab('udhaar',this)" data-tab="udhaar"><span class="ni">📒</span><span>Udhaar</span></button>
    <button class="nitem" onclick="setTab('usb',this)" data-tab="usb"><span class="ni">🔧</span><span>USB</span></button>
    <button class="nitem" onclick="setTab('wallets',this)" data-tab="wallets"><span class="ni">📲</span><span>Wallets</span></button>
    <button class="nitem" onclick="setTab('kharcha',this)" data-tab="kharcha"><span class="ni">💸</span><span>Expenses</span></button>
    <button class="nitem" onclick="setTab('balance',this)" data-tab="balance"><span class="ni">💼</span><span>Balance</span></button>
    <button class="nitem" onclick="setTab('sales',this)" data-tab="sales"><span class="ni">📋</span><span>Sales</span></button>
    <button class="nitem" onclick="setTab('reports',this)" data-tab="reports"><span class="ni">📊</span><span>Reports</span></button>
    <button class="nitem" onclick="setTab('inventory',this)" data-tab="inventory"><span class="ni">📦</span><span>Stock</span></button>
    <button class="nitem" onclick="setTab('addItem',this)" data-tab="addItem"><span class="ni">➕</span><span>Add</span></button>
    <button class="nitem" onclick="setTab('settings',this)" data-tab="settings"><span class="ni">⚙️</span><span>Settings</span></button>
  </nav>
</div>
<script>
const API='https://script.google.com/macros/s/AKfycbxRjvW4HtnoZQtFsppL3uS0_WqZUjVp7ZEmbdFjrG5isbyjFrGoOlNcqIASqDO_ViNu/exec';
const FIN_API='https://script.google.com/macros/s/AKfycbz30Lg-ObvWIc2dt_dCOy0ibu9JwnCr74NxYddUx69pcvmCG8TbjQdeUHKwYVEhlS_SWA/exec';
const CAT_EMOJI={'Mobile Phones':'📱','Accessories':'🎧','Chargers':'🔌','Cables':'🔗','Cases':'🛡️','Earphones':'🎵','Batteries':'🔋','Screens':'📺','Memory':'💾','Electronics':'⚡','Other':'📦'};
const CATS=Object.keys(CAT_EMOJI);
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const EXP_CATS=['Rent','Electricity','Staff Salary','Stock Purchase','Maintenance','Transport','Other'];

let inventory=[],sales=[],reports={},usbJobs=[],walletTx=[],udhaarList=[],expenses=[];
let balances={cash:0,jazz:0,easy:0,bank:0},balanceTx=[],finExpenses=[],purchases=[];
let cart=[];
let activeTab='sell',searchQ='',filterCat='',isSyncing=false,revealTimers={};

// ── PIN ──
let pinEntry='',pinMode='',pinSetTemp='';
function initApp(){
  const p=localStorage.getItem('cm_pin');
  if(p){showPinScreen('enter');}else{launchApp();}
}
function showPinScreen(mode){
  pinMode=mode;pinEntry='';
  const isEnter=mode==='enter',isConfirm=mode==='confirm';
  document.getElementById('pin-overlay').innerHTML=`
    <div class="pin-screen">
      <div class="pin-logo">📱</div>
      <div class="pin-shopname">Chouhdary Mobiles</div>
      <div class="pin-sub">POS &amp; Inventory System</div>
      <div class="pin-title">${isEnter?'Enter PIN':mode==='set'?'Set New PIN':'Confirm PIN'}</div>
      <div class="pin-dots"><div class="pin-dot" id="pd0"></div><div class="pin-dot" id="pd1"></div><div class="pin-dot" id="pd2"></div><div class="pin-dot" id="pd3"></div></div>
      <div class="pin-err" id="pin-err"></div>
      <div class="pin-pad">
        ${[1,2,3,4,5,6,7,8,9,'',0,'⌫'].map(k=>`<button class="pin-btn${k===''?' empty':k==='⌫'?' del':''}" onclick="pinPress('${k}')">${k}</button>`).join('')}
      </div>
      ${isEnter?`<button class="pin-forgot" onclick="forgotPin()">Forgot PIN?</button>`:''}
    </div>`;
}
function pinPress(k){
  if(k==='')return;
  if(k==='⌫'){pinEntry=pinEntry.slice(0,-1);updDots();return;}
  if(pinEntry.length>=4)return;
  pinEntry+=String(k);updDots();
  if(pinEntry.length===4)setTimeout(submitPin,150);
}
function updDots(){for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d)d.className='pin-dot'+(i<pinEntry.length?' filled':'');}}
function submitPin(){
  const saved=localStorage.getItem('cm_pin');
  if(pinMode==='enter'){
    if(pinEntry===saved){document.getElementById('pin-overlay').innerHTML='';launchApp();}
    else{pinErr('Wrong PIN. Try again.');}
  }else if(pinMode==='set'){
    pinSetTemp=pinEntry;showPinScreen('confirm');
  }else{
    if(pinEntry===pinSetTemp){localStorage.setItem('cm_pin',pinEntry);document.getElementById('pin-overlay').innerHTML='';toast('PIN set ✅');if(activeTab==='settings')renderTab();}
    else{pinErr('PINs do not match.');setTimeout(()=>showPinScreen('set'),900);}
  }
}
function pinErr(msg){
  document.getElementById('pin-err').textContent=msg;
  for(let i=0;i<4;i++){const d=document.getElementById('pd'+i);if(d){d.className='pin-dot error';d.style.animation='shake .3s';}}
  setTimeout(()=>{pinEntry='';updDots();const e=document.getElementById('pin-err');if(e)e.textContent='';},850);
}
function forgotPin(){if(confirm('Reset PIN? App will open without PIN.')){localStorage.removeItem('cm_pin');document.getElementById('pin-overlay').innerHTML='';launchApp();}}
function launchApp(){document.getElementById('app').style.display='flex';loadLocal();updateSummary();renderTab();syncAll();fetchFinExpenses();}

// ── STORAGE ──
function saveLocal(){
  try{
    localStorage.setItem('cm_inv',JSON.stringify(inventory));
    localStorage.setItem('cm_sales',JSON.stringify(sales));
    localStorage.setItem('cm_reports',JSON.stringify(reports));
    localStorage.setItem('cm_usb',JSON.stringify(usbJobs));
    localStorage.setItem('cm_wallet',JSON.stringify(walletTx));
    localStorage.setItem('cm_udhaar',JSON.stringify(udhaarList));
    localStorage.setItem('cm_expenses',JSON.stringify(expenses));
    localStorage.setItem('cm_balances',JSON.stringify(balances));
    localStorage.setItem('cm_balanceTx',JSON.stringify(balanceTx));
    localStorage.setItem('cm_finExp',JSON.stringify(finExpenses));
    localStorage.setItem('cm_purchases',JSON.stringify(purchases));
  }catch(e){}
}
function loadLocal(){
  try{
    inventory=JSON.parse(localStorage.getItem('cm_inv')||'[]');
    sales=JSON.parse(localStorage.getItem('cm_sales')||'[]');
    reports=JSON.parse(localStorage.getItem('cm_reports')||'{}');
    usbJobs=JSON.parse(localStorage.getItem('cm_usb')||'[]');
    walletTx=JSON.parse(localStorage.getItem('cm_wallet')||'[]');
    udhaarList=JSON.parse(localStorage.getItem('cm_udhaar')||'[]');
    expenses=JSON.parse(localStorage.getItem('cm_expenses')||'[]');
    const sb=JSON.parse(localStorage.getItem('cm_balances')||'{}');
    balances={cash:0,jazz:0,easy:0,bank:0,...sb};
    balanceTx=JSON.parse(localStorage.getItem('cm_balanceTx')||'[]');
    finExpenses=JSON.parse(localStorage.getItem('cm_finExp')||'[]');
    purchases=JSON.parse(localStorage.getItem('cm_purchases')||'[]');
  }catch(e){}
}

// ── UTILS ──
function toast(msg,dur=2500){const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');setTimeout(()=>el.classList.remove('show'),dur);}
function fmt(n){return 'Rs '+Math.round(n||0).toLocaleString();}
function fmtS(n){return Math.round(n||0).toLocaleString();}
function todayStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;}
function normDate(v){if(!v)return'';if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');const s=String(v);if(s.includes('T')){const d=new Date(s);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}return s.slice(0,10);}
function catEmoji(cat){return CAT_EMOJI[cat]||'📦';}
function dayLabel(date){const d=new Date(date+'T00:00:00'),now=new Date();now.setHours(0,0,0,0);const diff=Math.round((now-d)/86400000);return diff===0?'Today':diff===1?'Yesterday':`${d.getDate()} ${MONTHS[d.getMonth()]}`;}
function escHtml(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function getMonthStr(date){return String(date).slice(0,7);}
function getCurrentMonthStr(){const d=new Date();return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;}
function getMonthLabel(ym){const[y,m]=ym.split('-');return `${MONTHS[parseInt(m)-1]} ${y}`;}

// ── API ──
async function apiFetch(params){const r=await fetch(API+'?'+new URLSearchParams(params));return r.json();}
async function apiPost(params){const r=await fetch(API,{method:'POST',body:new URLSearchParams(params)});return r.json();}
async function fetchFinExpenses(){try{const r=await fetch(FIN_API+'?'+new URLSearchParams({action:'getExpenses'}));const d=await r.json();if(d.success&&d.exps){finExpenses=d.exps||[];saveLocal();}}catch(e){}}

// ── SYNC ──
function setSyncStatus(s,t){document.getElementById('syncBtn').className='sync-btn '+s;document.getElementById('syncTxt').textContent=t;}
async function syncAll(){
  if(isSyncing)return;isSyncing=true;setSyncStatus('warn','Syncing...');
  try{
    const all=await apiFetch({action:'getAll'});
    if(all&&all.success&&all.items!==undefined){
      inventory=all.items||[];sales=all.sales||[];reports=all.reports||reports;
      usbJobs=all.jobs||[];walletTx=all.txs||[];udhaarList=all.entries||[];expenses=all.exps||[];
      saveLocal();updateSummary();renderTab();setSyncStatus('ok','Synced ✓');fetchFinExpenses();isSyncing=false;return;
    }
  }catch(e){}
  const acts=['getInventory','getSales','getReports','getUSB','getWallets','getUdhaar','getExpenses'];
  const res=await Promise.allSettled(acts.map(a=>apiFetch({action:a})));
  const get=i=>res[i].status==='fulfilled'?res[i].value:null;
  let ok=0;
  const[invD,salesD,repD,usbD,walletD,udhaarD,expD]=[get(0),get(1),get(2),get(3),get(4),get(5),get(6)];
  if(invD&&invD.success){inventory=invD.items||[];ok++;}
  if(salesD&&salesD.success){sales=salesD.sales||[];ok++;}
  if(repD&&repD.success){reports=repD;ok++;}
  if(usbD&&usbD.success){usbJobs=usbD.jobs||[];ok++;}
  if(walletD&&walletD.success){walletTx=walletD.txs||[];ok++;}
  if(udhaarD&&udhaarD.success){udhaarList=udhaarD.entries||[];ok++;}
  if(expD&&expD.success){expenses=expD.exps||[];ok++;}
  saveLocal();updateSummary();renderTab();
  if(ok===acts.length)setSyncStatus('ok','Synced ✓');
  else if(ok>0){setSyncStatus('ok','Synced ✓');toast(ok+'/'+acts.length+' loaded');}
  else{setSyncStatus('warn','Offline');toast('Offline — working locally',4000);}
  fetchFinExpenses();isSyncing=false;
}

// ── SUMMARY ──
function updateSummary(){
  const s=getDailyStats();
  document.getElementById('s-customers').textContent=s.totalCustomers;
  document.getElementById('s-today').textContent=fmtS(s.netProfit);
  document.getElementById('s-usb').textContent=fmtS(usbJobs.reduce((a,j)=>a+parseFloat(j.profit||0),0));
  document.getElementById('s-wallet').textContent=fmtS(walletTx.reduce((a,t)=>a+parseFloat(t.profit||0),0));
  document.getElementById('s-udhaar').textContent=fmt(udhaarList.filter(u=>u.status!=='paid').reduce((a,u)=>a+parseFloat(u.amount||0),0));
  document.getElementById('s-expense').textContent=fmt(expenses.reduce((a,e)=>a+parseFloat(e.amount||0),0));
  updateCartBadge();
}
function updateCartBadge(){
  const total=cart.reduce((a,i)=>a+i.qty,0);
  const fab=document.getElementById('cart-fab');
  const cnt=document.getElementById('cart-count');
  if(fab)fab.style.display=total>0?'block':'none';
  if(cnt)cnt.textContent=total;
  const navCart=document.querySelector('[data-tab="cart"]');
  if(navCart)navCart.querySelector('.ni').textContent=total>0?`🛒`:' 🛒';
}

// ── DAILY STATS ──
function getDailyStats(){
  const today=todayStr();
  const isToday=v=>normDate(v)===today;
  const todaySales=sales.filter(s=>isToday(s.date));
  const productRevenue=todaySales.reduce((a,s)=>a+parseFloat(s.totalSale||0),0);
  const productProfit=todaySales.reduce((a,s)=>a+parseFloat(s.totalProfit||0),0);
  const customerSet=new Set();
  todaySales.forEach(s=>{if(s.customerName&&s.customerName.trim())customerSet.add(s.customerName.trim().toLowerCase());});
  usbJobs.filter(j=>isToday(j.date)).forEach(j=>{if(j.customer&&j.customer.trim())customerSet.add(j.customer.trim().toLowerCase());});
  walletTx.filter(t=>isToday(t.date)).forEach(t=>{if(t.desc&&t.desc.trim()&&t.desc!=='Commission')customerSet.add(t.desc.trim().toLowerCase());});
  const namedCount=customerSet.size;
  const anonSales=todaySales.filter(s=>!s.customerName||!s.customerName.trim()).length;
  const anonJobs=usbJobs.filter(j=>isToday(j.date)&&(!j.customer||!j.customer.trim())).length;
  const totalCustomers=namedCount+anonSales+anonJobs;
  const usbOnly=usbJobs.filter(j=>isToday(j.date)&&!String(j.desc||'').startsWith('[Repair]')).reduce((a,j)=>a+parseFloat(j.profit||0),0);
  const repair=usbJobs.filter(j=>isToday(j.date)&&String(j.desc||'').startsWith('[Repair]')).reduce((a,j)=>a+parseFloat(j.profit||0),0);
  const walletP=walletTx.filter(t=>isToday(t.date)).reduce((a,t)=>a+parseFloat(t.profit||0),0);
  const expToday=expenses.filter(e=>isToday(e.date)).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const finExpToday=finExpenses.filter(e=>isToday(e.date)).reduce((a,e)=>a+parseFloat(e.amount||0),0);
  const netProfit=productProfit+repair+usbOnly+walletP-expToday-finExpToday;
  return{productRevenue,productProfit,totalCustomers,usbToday:usbOnly,repairToday:repair,walletToday:walletP,expToday,finExpToday,netProfit,txCount:todaySales.length};
}

// ── BANNERS ──
function renderDailyBanner(){
  const s=getDailyStats();const d=new Date();
  const dateStr=`${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  return `<div class="banner day">
    <div class="banner-hd">📅 Today's Summary <span>${dateStr}</span></div>
    <div class="banner-grid">
      <div><div class="bcell-lbl">Revenue</div><div class="bcell-val g">${fmt(s.productRevenue)}</div></div>
      <div><div class="bcell-lbl">Customers</div><div class="bcell-val w">${s.totalCustomers}</div></div>
      <div><div class="bcell-lbl">Product Profit</div><div class="bcell-val g">${fmt(s.productProfit)}</div></div>
    </div>
    <div class="banner-div"></div>
    <div class="banner-net">
      <div>
        <div style="font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em">Net Profit Today</div>
        <div style="font-size:10px;color:var(--muted);margin-top:2px">Products${s.repairToday>0?` + Repair`:``}${s.usbToday>0?` + USB`:``}${s.walletToday>0?` + Wallets`:``}${s.expToday>0?` − Exp`:``}</div>
      </div>
      <div class="bnet-val" style="${s.netProfit<0?'color:var(--danger)':''}">${fmt(s.netProfit)}</div>
    </div>
  </div>`;
}
function renderMonthlyBanner(){
  const cur=getCurrentMonthStr();
  const byMonth=reports.byMonth||{};
  const curData=byMonth[getMonthLabel(cur)]||{};
  const usbP=usbJobs.filter(j=>getMonthStr(j.date)===cur).reduce((a,j)=>a+parseFloat(j.profit||0),0);
  const jazzP=walletTx.filter(t=>t.wallet==='JazzCash'&&getMonthStr(t.date)===cur).reduce((a,t)=>a+parseFloat(t.profit||0),0);
  const easyP=walletTx.filter(t=>t.wallet==='EasyPaisa'&&getMonthStr(t.date)===cur).reduce((a,t)=>a+parseFloat(t.profit||0),0);

function setTab(tab,btn){
  activeTab=tab;searchQ='';filterCat='';
  document.querySelectorAll('.nitem').forEach(b=>b.classList.remove('active'));

// ── CART ──
function addToCart(itemId){
  const item=inventory.find(i=>Number(i.id)===Number(itemId));if(!item)return;
  const existing=cart.find(c=>c.itemId===Number(itemId));
  if(existing){
    if(existing.qty<parseInt(item.quantity)){existing.qty++;toast(`${item.name} qty updated (${existing.qty})`);}
    else{toast('Max stock reached ⚠️');return;}
  }else{
    cart.push({itemId:Number(itemId),name:item.name,category:item.category,qty:1,salePrice:parseFloat(item.salePrice),purchasePrice:parseFloat(item.purchasePrice),maxQty:parseInt(item.quantity)});
    toast(`${item.name} added to cart ✓`);
  }
  updateCartBadge();
  if(activeTab==='sell')renderSellItems();
}
function removeFromCart(itemId){cart=cart.filter(c=>c.itemId!==Number(itemId));updateCartBadge();renderTab();}
function updateCartQty(itemId,delta){
  const item=cart.find(c=>c.itemId===Number(itemId));if(!item)return;
  item.qty+=delta;
  if(item.qty<=0){cart=cart.filter(c=>c.itemId!==Number(itemId));}
  else if(item.qty>item.maxQty){item.qty=item.maxQty;toast('Max stock reached ⚠️');}
  updateCartBadge();renderTab();
}
function updateCartItemPrice(itemId,val){const item=cart.find(c=>c.itemId===Number(itemId));if(item)item.salePrice=parseFloat(val)||item.salePrice;}
function renderCart(c){

    c.innerHTML=`<div class="empty"><div class="empty-icon">🛒</div><div class="empty-text">Cart is empty<br><span style="font-size:12px">Add items from Sell tab</span></div></div>`;
    return;

  const cartTotal=cart.reduce((a,i)=>a+i.salePrice*i.qty,0);
  const cartProfit=cart.reduce((a,i)=>a+(i.salePrice-i.purchasePrice)*i.qty,0);

          <div class="ci-name">${escHtml(item.name)}</div>

          <div class="ci-total" data-cid="${item.itemId}">${fmt(item.salePrice*item.qty)}</div>
          <button class="del-btn" onclick="removeFromCart(${item.itemId})">🗑️</button>
        </div>
      </div>`).join('')}
    <div class="cart-sum">
      <div class="cs-row"><span>${cart.reduce((a,i)=>a+i.qty,0)} items</span><span style="color:var(--text)">Total:</span></div>
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:8px">
        <div class="cs-total">${fmt(cartTotal)}</div>
        <div style="font-size:12px;color:var(--success)">Profit: +${fmt(cartProfit)}</div>
      </div>
    </div>
    <div class="form-card">
      <div class="form-title">Checkout</div>
      <div class="form-field" style="margin-bottom:10px">
        <label>Customer Name (optional)</label>
        <input type="text" id="cart-customer" placeholder="e.g. Ali, Walk-in..." autocomplete="off"/>
      </div>
      <div style="font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Payment to wallet:</div>
      <div class="wsel" id="cart-wsel">
        <div class="wsel-btn active" id="cw-cash" onclick="selectCartWallet('cash')"><span class="wi">💵</span><span class="wn">Cash</span></div>
        <div class="wsel-btn" id="cw-jazz" onclick="selectCartWallet('jazz')"><span class="wi">📲</span><span class="wn">Jazz</span></div>
        <div class="wsel-btn" id="cw-easy" onclick="selectCartWallet('easy')"><span class="wi">💚</span><span class="wn">Easy</span></div>
        <div class="wsel-btn" id="cw-bank" onclick="selectCartWallet('bank')"><span class="wi">🏦</span><span class="wn">Bank</span></div>
      </div>
      <input type="hidden" id="cart-wallet" value="cash"/>
      <button class="btn primary" onclick="checkoutCart()">✓ Complete Sale · ${fmt(cartTotal)}</button>

function selectCartWallet(w){
  document.getElementById('cart-wallet').value=w;
  ['cash','jazz','easy','bank'].forEach(x=>{const el=document.getElementById('cw-'+x);if(el)el.className='wsel-btn'+(x===w?' active':'');});
}
async function checkoutCart(){
  if(!cart.length){toast('Cart is empty ⚠️');return;}
  const customerName=(document.getElementById('cart-customer')?.value||'').trim();
  const wallet=document.getElementById('cart-wallet')?.value||'cash';
  toast('Processing...');
  let successCount=0;
  for(const cartItem of cart){
    const inv=inventory.find(i=>Number(i.id)===Number(cartItem.itemId));
    const totalSaleAmt=cartItem.salePrice*cartItem.qty;
    const totalProfit=(cartItem.salePrice-cartItem.purchasePrice)*cartItem.qty;
    try{
      const d=await apiPost({action:'addSale',itemId:cartItem.itemId,quantity:cartItem.qty,customerName,salePrice:cartItem.salePrice});
      if(d.success){
        successCount++;
        addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name+' x'+cartItem.qty+(customerName?' to '+customerName:''));
      }else{
        if(inv)inv.quantity=Math.max(0,parseInt(inv.quantity)-cartItem.qty);
        sales.push({id:Date.now()+successCount,date:todayStr(),itemId:cartItem.itemId,itemName:cartItem.name,category:cartItem.category,quantity:cartItem.qty,purchasePrice:cartItem.purchasePrice,salePrice:cartItem.salePrice,totalSale:totalSaleAmt,totalProfit,customerName});
        addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name);
        successCount++;
      }
    }catch(e){
      if(inv)inv.quantity=Math.max(0,parseInt(inv.quantity)-cartItem.qty);
      sales.push({id:Date.now()+successCount,date:todayStr(),itemId:cartItem.itemId,itemName:cartItem.name,category:cartItem.category,quantity:cartItem.qty,purchasePrice:cartItem.purchasePrice,salePrice:cartItem.salePrice,totalSale:totalSaleAmt,totalProfit,customerName});
      addToWalletBalance(wallet,totalSaleAmt,'Sale: '+cartItem.name);
      successCount++;
    }
  }
  saveLocal();cart=[];updateCartBadge();
  await syncAll();toast(`${successCount} item(s) sold ✅`);
}
function addToWalletBalance(wallet,amount,desc){
  if(wallet==='cash')addToCashBalance(amount,desc);
  else if(wallet==='jazz')addToJazzBalance(amount,desc);
  else if(wallet==='easy')addToEasyBalance(amount,desc);
  else if(wallet==='bank')addToBankBalance(amount,desc);
}

async function addUdhaar(){
  const customer=document.getElementById('u-customer')?.value.trim();
  const amount=parseFloat(document.getElementById('u-amount')?.value);
  const desc=document.getElementById('u-desc')?.value.trim()||'';
  if(!customer||isNaN(amount)||amount<=0){toast('Enter customer name and amount ⚠️');return;}
  toast('Saving...');
  try{
    const d=await apiPost({action:'addUdhaar',customer,amount,desc});
    if(d.success){await syncAll();toast('Udhaar added ✅');}
    else{udhaarList.push({id:Date.now(),customer,amount,desc,date:todayStr(),status:'pending'});saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');}

async function markUdhaarPaid(id){

}

  const val=parseFloat(document.getElementById('bal-edit-val')?.value)||0;
  const old=balances[wallet]||0;const diff=val-old;
  balances[wallet]=val;
  if(diff!==0)balanceTx.push({type:diff>0?'in':'out',wallet,amount:Math.abs(diff),desc:'Manual adjustment',date:todayStr(),ts:Date.now()});
  saveLocal();document.getElementById('modal').innerHTML='';renderTab();toast('Balance updated ✅');

  const wallet=document.getElementById('b-wallet')?.value;

  const note=document.getElementById('b-note')?.value.trim()||'Manual entry';

  balanceTx.push({type,wallet,amount,desc:note,date:todayStr(),ts:Date.now()});

function deductFinExpenses(){
  const finTotal=finExpenses.reduce((a,e)=>a+parseFloat(e.amount||0),0);

  balanceTx.push({type:'out',wallet:'cash',amount:finTotal,desc:'Finance Tracker deducted',date:todayStr(),ts:Date.now()});

}

// ── ADD ITEM ──
function renderAddItem(c){
  const catOpts=CATS.map(cat=>`<option value="${cat}">${catEmoji(cat)} ${cat}</option>`).join('');
  c.innerHTML=`<div class="form-card"><div class="form-title">Add New Item</div><div class="form-grid">
    <div class="form-field full"><label>Item Name</label><input type="text" id="i-name" placeholder="e.g. Samsung 25W Charger"/></div>
    <div class="form-field full"><label>Category</label><select id="i-cat">${catOpts}</select></div>
    <div class="form-field"><label>Purchase Price (Rs)</label><input type="number" id="i-buy" placeholder="0" inputmode="numeric"/></div>
    <div class="form-field"><label>Sale Price (Rs)</label><input type="number" id="i-sell" placeholder="0" inputmode="numeric"/></div>
    <div class="form-field"><label>Quantity</label><input type="number" id="i-qty" placeholder="0" inputmode="numeric"/></div>
    <div class="form-field"><label>Low Stock Alert</label><input type="number" id="i-alert" placeholder="5" inputmode="numeric"/></div>
  </div><button class="btn primary" onclick="addItem()">✓ Add to Inventory</button></div>`;
  setTimeout(()=>document.getElementById('i-name')?.focus(),100);
}
async function addItem(){
  const name=document.getElementById('i-name')?.value.trim();
  const cat=document.getElementById('i-cat')?.value;
  const buy=parseFloat(document.getElementById('i-buy')?.value);
  const sell=parseFloat(document.getElementById('i-sell')?.value);
  const qty=parseInt(document.getElementById('i-qty')?.value);
  const alertQty=parseInt(document.getElementById('i-alert')?.value)||5;
  if(!name||isNaN(buy)||isNaN(sell)||isNaN(qty)){toast('Fill all fields ⚠️');return;}
  if(sell<buy){toast('Sale price must be higher ⚠️');return;}
  toast('Adding...');
  try{
    const d=await apiPost({action:'addItem',name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});
    if(d.success){await syncAll();setTab('inventory');toast('Item added ✅');}
    else{inventory.push({id:Date.now(),name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});saveLocal();updateSummary();setTab('inventory');toast('Saved locally ⚠️');}
  }catch(e){inventory.push({id:Date.now(),name,category:cat,purchasePrice:buy,salePrice:sell,quantity:qty,lowStockAlert:alertQty});saveLocal();updateSummary();setTab('inventory');toast('Saved locally ⚠️');}
}

// ── MODALS ──
function showSellModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const defPrice=parseFloat(item.salePrice)||0;
  const buyPrice=parseFloat(item.purchasePrice)||0;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">${escHtml(item.name)}</div>
    <div class="modal-sub">${escHtml(item.category)} · ${item.quantity} units in stock</div>
    <div class="modal-info">
      <div class="mii"><div class="mii-lbl">Default Price</div><div class="mii-val">${fmt(defPrice)}</div></div>
      <div class="mii"><div class="mii-lbl">In Stock</div><div class="mii-val">${item.quantity}</div></div>
      <div class="mii"><div class="mii-lbl">Margin</div><div class="mii-val" style="color:var(--accent)">+${fmt(defPrice-buyPrice)}</div></div>
    </div>
    <div class="form-field" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block">Customer Name (optional)</label><input class="qty-in" type="text" id="sell-customer" placeholder="e.g. Ali, Walk-in..." autocomplete="off"/></div>
    <div class="form-field" style="margin-bottom:10px"><label style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block">Quantity</label><input class="qty-in" type="number" id="sell-qty" value="1" min="1" max="${item.quantity}" inputmode="numeric" oninput="updateSellMargin(${buyPrice})"/></div>
    <div class="form-field" style="margin-bottom:6px"><label style="font-size:11px;color:var(--muted);text-transform:uppercase;margin-bottom:4px;display:block">Sale Price (Rs)</label><input class="qty-in" type="number" id="sell-price" value="${defPrice}" inputmode="numeric" oninput="updateSellMargin(${buyPrice})"/></div>
    <div class="bargain-hint" id="sell-margin-hint" style="margin-bottom:12px">Margin: <span style="color:var(--accent);font-weight:700">+${fmt(defPrice-buyPrice)}</span> per unit · Total: <span style="color:var(--accent)">${fmt(defPrice)}</span></div>
    <div style="font-size:11px;color:var(--muted);margin-bottom:8px;text-transform:uppercase;letter-spacing:.05em">Payment to wallet:</div>
    <div class="wsel" id="sell-wsel">
      <div class="wsel-btn active" id="sw-cash" onclick="selectSellWallet('cash')"><span class="wi">💵</span><span class="wn">Cash</span></div>
      <div class="wsel-btn" id="sw-jazz" onclick="selectSellWallet('jazz')"><span class="wi">📲</span><span class="wn">Jazz</span></div>
      <div class="wsel-btn" id="sw-easy" onclick="selectSellWallet('easy')"><span class="wi">💚</span><span class="wn">Easy</span></div>
      <div class="wsel-btn" id="sw-bank" onclick="selectSellWallet('bank')"><span class="wi">🏦</span><span class="wn">Bank</span></div>
    </div>
    <input type="hidden" id="sell-wallet" value="cash"/>
    <button class="btn primary" onclick="confirmSell(${item.id})">✓ Confirm Sale</button>
    <div class="btn-gap"></div>
    <button class="btn secondary" onclick="document.getElementById('modal').innerHTML=''">Cancel</button>
  </div></div>`;
  setTimeout(()=>document.getElementById('sell-qty')?.select(),100);
}
function selectSellWallet(w){
  document.getElementById('sell-wallet').value=w;
  ['cash','jazz','easy','bank'].forEach(x=>{const el=document.getElementById('sw-'+x);if(el)el.className='wsel-btn'+(x===w?' active':'');});
}
function updateSellMargin(buyPrice){
  const sp=parseFloat(document.getElementById('sell-price')?.value)||0;
  const qty=parseInt(document.getElementById('sell-qty')?.value)||1;
  const margin=sp-buyPrice;
  const hint=document.getElementById('sell-margin-hint');
  if(hint){const c=margin>=0?'var(--accent)':'var(--danger)';hint.innerHTML=`Margin: <span style="color:${c};font-weight:700">${margin>=0?'+':''}${fmt(margin)}</span> per unit · Total: <span style="color:var(--accent)">${fmt(sp*qty)}</span>`;}
}
function showRestockModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>
    <div class="modal-title">Restock: ${escHtml(item.name)}</div>
    <div class="modal-sub">Current stock: ${item.quantity} units</div>
    <div class="form-grid" style="margin-bottom:12px">
      <div class="form-field"><label>Add Quantity</label><input class="qty-in" type="number" id="rs-qty" value="10" min="1" inputmode="numeric"/></div>
      <div class="form-field"><label>Purchase Price/unit (Rs)</label><input class="qty-in" type="number" id="rs-price" value="${item.purchasePrice}" inputmode="numeric"/></div>
      <div class="form-field"><label>Supplier Name (optional)</label><input class="qty-in" type="text" id="rs-supplier" placeholder="e.g. Ali Traders"/></div>
      <div class="form-field"><label>Note (optional)</label><input class="qty-in" type="text" id="rs-note" placeholder="e.g. Bulk purchase"/></div>

    <button class="btn primary" onclick="confirmRestock(${item.id})">✓ Add Stock</button>
    <div class="btn-gap"></div>

function showEditModal(id){
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const catOpts=CATS.map(cat=>`<option value="${cat}" ${item.category===cat?'selected':''}>${catEmoji(cat)} ${cat}</option>`).join('');
  document.getElementById('modal').innerHTML=`<div class="modal-bg" onclick="closeModal(event)"><div class="modal">
    <div class="modal-handle"></div>

function closeModal(e){if(e.target.classList.contains('modal-bg'))document.getElementById('modal').innerHTML='';}

// ── ACTIONS ──
async function confirmSell(id){
  const qty=parseInt(document.getElementById('sell-qty')?.value);
  const customerName=(document.getElementById('sell-customer')?.value||'').trim();
  const sellWallet=document.getElementById('sell-wallet')?.value||'cash';
  const item=inventory.find(i=>Number(i.id)===Number(id));
  const actualPrice=parseFloat(document.getElementById('sell-price')?.value)||parseFloat(item?.salePrice||0);
  if(!qty||qty<1){toast('Enter valid quantity ⚠️');return;}
  if(item&&qty>parseInt(item.quantity)){toast('Not enough stock! Only '+item.quantity+' left ⚠️');return;}
  document.getElementById('modal').innerHTML='';toast('Recording sale...');
  const totalSaleAmt=actualPrice*qty;
  const buyP=parseFloat(item?.purchasePrice||0);
  const totalProfit=(actualPrice-buyP)*qty;
  try{
    const d=await apiPost({action:'addSale',itemId:id,quantity:qty,customerName,salePrice:actualPrice});
    if(d.success){addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item')+' x'+qty+(customerName?' to '+customerName:''));await syncAll();toast('Sale recorded ✅');}
    else{
      if(item)item.quantity=Math.max(0,parseInt(item.quantity)-qty);
      sales.push({id:Date.now(),date:todayStr(),itemId:id,itemName:item?.name||'',category:item?.category||'',quantity:qty,purchasePrice:buyP,salePrice:actualPrice,totalSale:totalSaleAmt,totalProfit,customerName});
      addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item'));
      saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');
    }
  }catch(e){
    if(item)item.quantity=Math.max(0,parseInt(item.quantity)-qty);
    sales.push({id:Date.now(),date:todayStr(),itemId:id,itemName:item?.name||'',category:item?.category||'',quantity:qty,purchasePrice:buyP,salePrice:actualPrice,totalSale:totalSaleAmt,totalProfit,customerName});
    addToWalletBalance(sellWallet,totalSaleAmt,'Sale: '+(item?.name||'Item'));
    saveLocal();updateSummary();renderTab();toast('Saved locally ⚠️');
  }
}
async function confirmRestock(id){
  const addQty=parseInt(document.getElementById('rs-qty')?.value);
  const unitPrice=parseFloat(document.getElementById('rs-price')?.value)||0;
  const supplier=(document.getElementById('rs-supplier')?.value||'').trim();
  const note=(document.getElementById('rs-note')?.value||'').trim();
  if(!addQty||addQty<1){toast('Enter valid quantity ⚠️');return;}
  const item=inventory.find(i=>Number(i.id)===Number(id));if(!item)return;
  const newQty=parseInt(item.quantity)+addQty;
  const totalCost=unitPrice*addQty;
  // Save purchase record locally
  purchases.push({id:Date.now(),itemId:Number(id),itemName:item.name,supplierName:supplier,qty:addQty,unitPrice,totalCost,date:todayStr(),note});
  document.getElementById('modal').innerHTML='';toast('Restocking...');
  try{
    const d=await apiPost({action:'updateQuantity',id,quantity:newQty});
    if(d.success){await syncAll();toast('Stock updated ✅');}
    else{item.quantity=newQty;saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
  }catch(e){item.quantity=newQty;saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
}
async function confirmEdit(id){
  const name=document.getElementById('edit-name')?.value.trim();
  const category=document.getElementById('edit-cat')?.value;
  const purchasePrice=parseFloat(document.getElementById('edit-buy')?.value);
  const salePrice=parseFloat(document.getElementById('edit-sell')?.value);
  const lowStockAlert=parseInt(document.getElementById('edit-alert')?.value)||5;
  if(!name||isNaN(purchasePrice)||isNaN(salePrice)){toast('Fill all fields ⚠️');return;}
  if(salePrice<purchasePrice){toast('Sale price must be higher ⚠️');return;}
  document.getElementById('modal').innerHTML='';toast('Saving...');
  try{
    const d=await apiPost({action:'updateItem',id,name,category,purchasePrice,salePrice,lowStockAlert});
    if(d.success){await syncAll();toast('Item updated ✅');}
    else{const it=inventory.find(i=>Number(i.id)===Number(id));if(it)Object.assign(it,{name,category,purchasePrice,salePrice,lowStockAlert});saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
  }catch(e){const it=inventory.find(i=>Number(i.id)===Number(id));if(it)Object.assign(it,{name,category,purchasePrice,salePrice,lowStockAlert});saveLocal();updateSummary();renderTab();toast('Updated locally ⚠️');}
}
async function deleteItem(id){
  if(!confirm('Delete this item?'))return;
  inventory=inventory.filter(i=>Number(i.id)!==Number(id));saveLocal();updateSummary();renderTab();toast('Deleting...');
  try{const r=await apiPost({action:'deleteItem',id});if(!r.success)throw new Error();toast('Deleted ✅');}
  catch(e){toast('Deleted locally ⚠️',4000);}
}

// ── BOOT ──
loadLocal();updateSummary();initApp();
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('./sw.js').then(reg=>{
    reg.addEventListener('updatefound',()=>{
      const nw=reg.installing;
      nw.addEventListener('statechange',()=>{if(nw.state==='activated'){toast('App updated! Reloading...',1500);setTimeout(()=>window.location.reload(true),1500);}});
    });
    reg.update();
  }).catch(()=>{});
}
